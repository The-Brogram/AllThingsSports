<meta charset="utf-8"><title>AllThingsSports</title><meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Scoreboard look: white field, one green (the side the model favors, right picks) and one red (the other side, wrong picks, early numbers).
   Layout: slim header, floating segmented nav, a week rail, then each day's games as a card grid; side by side opens full width under its day.
   Deliberately light in every theme. */
:root{
  --bg:#ffffff;--pan:#f5f7f6;--pan2:#edf0ef;--line:#e2e6e4;--line2:#cdd3d0;
  --fg:#111615;--mut:#59626a;--dim:#838b91;
  --grn:#0ea865;--grn-d:rgba(14,168,101,.14);--pa:#2563eb;--pb:#d97706;--red:#e1213b;--red-d:rgba(225,33,59,.16);
  --disp:'Archivo','Arial Narrow',Impact,sans-serif;--body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px;--gut:max(16px,env(safe-area-inset-left,0px));--gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--grn)}
button,select{font-family:inherit}
:focus-visible{outline:2px solid var(--grn);outline-offset:2px}

/* header */
.top{position:relative;overflow:hidden;padding-block:34px 26px;padding-left:var(--gut);padding-right:var(--gutr);border-bottom:1px solid var(--line)}
.top::before{content:"";position:absolute;inset:-40% -10% auto auto;width:60%;height:200%;background:radial-gradient(closest-side,rgba(14,168,101,.10),transparent 70%);pointer-events:none}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--grn),transparent 45%,transparent 55%,var(--red))}
.wrap{max-width:1240px;margin:0 auto;position:relative}
.eyebrow{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--fg);background:var(--red-d);border:1px solid rgba(225,33,59,.35);padding:3px 10px;border-radius:999px;letter-spacing:.08em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(225,33,59,.6)}
@media (prefers-reduced-motion:no-preference){.live i{animation:pulse 2s infinite}@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(225,33,59,0)}100%{box-shadow:0 0 0 0 rgba(225,33,59,0)}}html{scroll-behavior:smooth}}
.top h1{font:900 clamp(40px,8vw,84px)/.92 var(--disp);font-stretch:118%;letter-spacing:-.02em;text-transform:uppercase;margin:14px 0 12px;text-wrap:balance}
.top h1 span{color:var(--grn)}
.top p{margin:0;color:var(--mut);max-width:70ch;font-size:15px}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut);padding-right:var(--gutr)}
.seg{max-width:1240px;margin:0 auto;display:flex}
.seg div{display:inline-flex;gap:2px;background:var(--pan);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;max-width:100%}
nav button{font:600 14px var(--body);border:0;background:transparent;color:var(--mut);padding:7px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
nav button:hover{color:var(--fg)}
nav button[aria-pressed=true]{background:var(--fg);color:var(--bg)}

main{max-width:1240px;margin:0 auto;padding-block:22px 72px;padding-left:var(--gut);padding-right:var(--gutr)}
h2{font:800 clamp(30px,5vw,44px)/1 var(--disp);font-stretch:112%;text-transform:uppercase;letter-spacing:-.01em;margin:0;text-wrap:balance}
.note{color:var(--mut);font-size:13.5px;max-width:90ch}

/* week rail */
.wstrip{display:flex;gap:6px;overflow-x:auto;padding-block:2px 14px;margin-bottom:14px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.wstrip button{flex:0 0 auto;display:grid;gap:2px;text-align:center;min-width:58px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--pan);color:var(--fg);cursor:pointer;font:700 15px var(--disp);font-stretch:110%;transition:border-color .15s,background .15s}
.wstrip button small{font:500 10.5px var(--mono);color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.wstrip button:hover{border-color:var(--line2)}
.wstrip button.done{color:var(--mut)}
.wstrip button.cur{border-color:rgba(225,33,59,.55)}.wstrip button.cur small{color:var(--red)}
.wstrip button[aria-pressed=true]{background:var(--grn);border-color:var(--grn);color:var(--bg)}.wstrip button[aria-pressed=true] small{color:var(--bg);opacity:.75}

.whead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:10px}
.whead .note{font-family:var(--mono);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-block:6px 4px}
.legend>span{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);background:var(--pan);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px}

/* status pills */
.st{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.st.final{background:var(--pan2);color:var(--mut);border-color:var(--line2)}
.st.book{background:var(--grn);color:var(--bg)}
.st.lines{color:var(--grn);border-color:rgba(14,168,101,.45);background:var(--grn-d)}
.st.early{color:var(--red);border-color:rgba(225,33,59,.45);background:var(--red-d)}

.day{font:700 13px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--mut);margin:30px 0 12px;display:flex;align-items:center;gap:12px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}

/* game cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px}
.gc{background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0;transition:border-color .2s,transform .2s}
.gc:hover{border-color:var(--line2)}
.gc.sel{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn),0 10px 40px -12px rgba(14,168,101,.35)}
.gc .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--mut);min-width:0}
.gc .meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm2{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.tm2 b{font:800 28px/1 var(--disp);font-stretch:115%;letter-spacing:-.01em}
.tm2 .nm{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm2 .pt{font:700 24px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.tm2 .pt.fin{font-size:28px}.tm2 .fav{color:var(--grn)}
.tm2 .lose{opacity:.4}
.wbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--mut)}
.wbar .on{color:var(--grn)}
.wp{display:flex;gap:3px;height:6px}
.wp span{display:block;height:100%;border-radius:3px;min-width:3px}
.wp .f{background:var(--grn)}.wp .u{background:var(--red);opacity:.55}
.lns{display:grid;grid-template-columns:1fr 1fr;gap:10px;font:500 12.5px var(--mono);font-variant-numeric:tabular-nums}
.lns>span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.lns small{display:block;font:600 10px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}
.likely{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.likely .h{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.likely li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.likely li:not(.h) span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.likely li:not(.h) span:last-child{font:700 12px var(--mono);color:var(--grn);background:var(--grn-d);padding:2px 8px;border-radius:999px}
.res{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--mut)}
.tag{font:700 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px}
.tag.good{color:var(--grn);background:var(--grn-d)}.tag.bad{color:var(--red);background:var(--red-d)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 13px var(--body);border:1px solid var(--line2);background:transparent;color:var(--fg);padding:7px 14px;border-radius:999px;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--mut)}
.btn.fill{background:var(--grn);border-color:var(--grn);color:var(--bg)}.btn.fill:hover{filter:brightness(1.08)}
.btn[aria-expanded=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.sbs{margin-top:14px;scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}

/* side by side */
.mhead{display:grid;grid-template-columns:1fr minmax(0,1.5fr) 1fr;gap:14px;align-items:center;background:radial-gradient(120% 140% at 0% 0%,rgba(14,168,101,.10),transparent 55%),radial-gradient(120% 140% at 100% 100%,rgba(225,33,59,.10),transparent 55%),var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:14px}
.mhead .tm b{display:block;font:900 clamp(34px,6vw,58px)/1 var(--disp);font-stretch:118%}
.mhead .tm span{font:500 12.5px var(--mono);color:var(--mut)}
.mhead .r{text-align:right}
.mhead .mid{display:grid;gap:8px;text-align:center}
.mhead .pts{display:flex;justify-content:center;align-items:baseline;gap:14px}
.mhead .pts b{font:700 38px/1 var(--mono);font-variant-numeric:tabular-nums}
.mhead small{color:var(--mut);font-size:12.5px}
.mblock{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-block:12px}
.mblock h4{font:800 17px var(--disp);font-stretch:112%;text-transform:uppercase;letter-spacing:.01em;margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kind{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;padding:3px 9px;border-radius:999px}
.kind.pred{background:var(--grn-d);color:var(--grn)}.kind.ctx{border:1px solid var(--line2);color:var(--mut)}
.mrow{display:grid;grid-template-columns:1fr minmax(120px,200px) 1fr;gap:8px 18px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-of-type{border-bottom:0}
.mrow .lab{text-align:center;font-size:13px;color:var(--mut)}
.mrow .l,.mrow .r{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}.mrow .l{grid-template-columns:1fr auto}
.mrow .l .v{order:2;text-align:right}.mrow .l .bar{order:1;direction:rtl}
.mrow .v{font:600 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}.mrow .v i{font-style:normal;font-weight:400;color:var(--dim);font-size:11px;margin-left:5px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:block}
.bar span{display:block;height:100%;border-radius:3px;background:var(--red);opacity:.55}
.mrow .win .bar span{background:var(--grn);opacity:1}.mrow .win .v{color:var(--grn)}

.mrow .lab small{display:block;font-size:11px;color:var(--dim)}
.mcols{display:grid;grid-template-columns:1fr minmax(120px,200px) 1fr;gap:8px 18px;align-items:end;padding:2px 0 10px;border-bottom:1px solid var(--line2);margin-bottom:2px}
.mcols b{display:block;font:800 15px var(--disp);font-stretch:112%;text-transform:uppercase;letter-spacing:.02em}.mcols small{display:block;font:500 11.5px var(--mono);color:var(--mut)}
.mcols .l{text-align:right}.mcols .lab{text-align:center;font:500 10.5px/1.45 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.05em}

/* compare + record */
.cmp{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;margin-block:14px}
.cmp label{display:grid;gap:5px;font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
select{font:600 15px var(--body);padding:9px 12px;border:1px solid var(--line2);background:var(--pan);color:var(--fg);border-radius:10px;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-block:16px}
.kpi{background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi small{display:block;font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.kpi b{display:block;font:800 44px/1.1 var(--disp);font-stretch:110%;font-variant-numeric:tabular-nums;margin-top:6px;color:var(--grn)}
.kpi p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font:13px/1.4 var(--mono);font-variant-numeric:tabular-nums}
th{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);text-align:right;padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:hover td{background:var(--pan2)}
.hb{display:block;height:6px;border-radius:3px;background:var(--grn);margin-block:2px}.hb.p{background:var(--mut);opacity:.4}
.empty{color:var(--mut);background:var(--pan);border:1px dashed var(--line2);border-radius:var(--r);padding:16px 18px}

@media (max-width:640px){
  .mrow{grid-template-columns:1fr 1fr;grid-template-areas:"lab lab" "l r";row-gap:4px}.mcols{grid-template-columns:1fr 1fr}.mcols .lab{grid-column:1/-1;grid-row:1}.mrow .lab{grid-area:lab}.mrow .l{grid-area:l}.mrow .r{grid-area:r}
  .mhead{grid-template-columns:1fr 1fr;padding:16px}.mhead .mid{grid-column:1/-1;grid-row:2}
  .top{padding-block:26px 20px}
}

/* sidebar: sport first, then its pages. On narrow screens it slides in from the left. */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.content{min-width:0}
#side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--pan);border-right:1px solid var(--line);padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:22px}
.brand{font:900 20px/1 var(--disp);font-stretch:108%;letter-spacing:-.01em;padding-inline:8px;display:flex;gap:0}.brand b{color:var(--grn)}
.sport{display:grid;gap:2px}.spl{display:grid;gap:2px}
.sport>summary{list-style:none;cursor:pointer;border-radius:10px;user-select:none}.sport>summary::-webkit-details-marker{display:none}
.sport>summary:hover{background:var(--pan2)}
.sh .chev{width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin:-3px 4px 0 2px;transition:transform .15s}
.sport:not([open])>summary .chev{transform:rotate(-45deg);margin-top:0}
.sh{display:flex;align-items:center;gap:8px;font:800 15px var(--disp);font-stretch:112%;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px 10px}
.sh i{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 3px var(--grn-d)}.sh small{margin-left:auto;font:500 10.5px var(--mono);color:var(--dim);text-transform:none;letter-spacing:0}
#side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:600 14px var(--body);color:var(--mut);background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer;position:relative}
#side button .ic{width:18px;text-align:center;color:var(--dim);font-size:13px}
#side button:hover{color:var(--fg);background:var(--pan2)}
#side button[aria-pressed=true]{color:var(--fg);background:var(--pan2)}#side button[aria-pressed=true] .ic{color:var(--grn)}
#side button[aria-pressed=true]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--grn)}
.soon{margin-top:auto;border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;display:grid;gap:2px}.soon b{font:700 13px var(--body);color:var(--mut)}.soon small{font-size:12px;color:var(--dim)}
.mbar{display:none}.scrim{display:none}
@media (max-width:959px){
  .shell{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:min(84vw,290px);z-index:40;transform:translateX(-105%);box-shadow:20px 0 60px rgba(16,22,21,.14)}
  body.mm #side{transition:transform .22s ease}
  body.menu #side{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(16,22,21,.32)}
  .mbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut);padding-right:var(--gutr)}
  .mbar button{font:600 14px var(--body);color:var(--fg);background:var(--pan);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;cursor:pointer}
  .mbar span{font:600 12px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

/* player lookup */
.pl-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:6px}
.search{position:relative;max-width:620px;margin-block:14px 10px}
.search input{width:100%;font:500 17px var(--body);color:var(--fg);background:var(--pan);border:1px solid var(--line2);border-radius:14px;padding:13px 16px 13px 44px;outline:none}
.search input:focus{border-color:var(--grn);box-shadow:0 0 0 3px var(--grn-d)}
.search::before{content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-52%);font-size:22px;color:var(--dim)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;background:var(--pan2);border:1px solid var(--line2);border-radius:14px;padding:6px;list-style:none;margin:0;box-shadow:0 20px 50px -10px rgba(16,22,21,.16);max-height:380px;overflow-y:auto}
.sres li button{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:8px 10px;border-radius:10px;cursor:pointer;font:500 14.5px var(--body)}
.sres li button:hover,.sres li button.on{background:var(--pan)}
.pos{display:inline-grid;place-items:center;font:700 11px var(--mono);border-radius:7px;padding:3px 0;min-width:36px;background:var(--bg);border:1px solid var(--line2);color:var(--mut)}
.pos.QB{color:#a86f0a;border-color:rgba(168,111,10,.4)}.pos.RB{color:var(--grn);border-color:rgba(14,168,101,.4)}.pos.WR{color:#1a73c9;border-color:rgba(26,115,201,.4)}.pos.TE{color:#c22e47;border-color:rgba(194,46,71,.4)}
.sres small{font:500 12px var(--mono);color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--body);background:var(--pan);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 14px;cursor:pointer}.chip[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px;margin-top:14px}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);cursor:pointer;font:inherit}
.pcard:hover{border-color:var(--line2)}.pcard b{font:700 15px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcard small{grid-column:2;font:500 12px var(--mono);color:var(--mut)}

function uform(s){const m=/(\d+)-(\d+)-(\d+)/.exec(s||'');return m?{w:+m[1],d:+m[2],l:+m[3],pts:3*m[1]+ +m[2],n:+m[1]+ +m[2]+ +m[3]}:null}

/* a team's UCL results this season, oldest first */
const useason=id=>UCL.fx.filter(f=>f.fin&&(f.h.id===id||f.a.id===id)).map(f=>{const h=f.h.id===id,gf=h?f.hs:f.as,ga=h?f.as:f.hs;return{f,h,gf,ga,r:gf>ga?'W':gf<ga?'L':'D',opp:h?f.a.name:f.h.name}});

function usplit(G){const o={gp:G.length};if(!G.length)return o;const c=f=>G.filter(f).length;o.w=c(g=>g.gf>g.ga);o.d=c(g=>g.gf===g.ga);o.l=c(g=>g.gf<g.ga);
  o.ppg=(3*o.w+o.d)/o.gp;o.gf=G.reduce((s,g)=>s+g.gf,0)/o.gp;o.ga=G.reduce((s,g)=>s+g.ga,0)/o.gp;o.cs=c(g=>!g.ga)/o.gp;o.fts=c(g=>!g.gf)/o.gp;o.o25=c(g=>g.gf+g.ga>2.5)/o.gp;o.btts=c(g=>g.gf&&g.ga)/o.gp;return o}
/* one mirrored comparison row; better: 'hi' | 'lo' | null */
function urow(label,sub,hv,av,better,fmt=v=>ufx(v),scale){const ok=hv!=null&&av!=null&&!isNaN(hv)&&!isNaN(av),mx=scale??(Math.max(Math.abs(hv||0),Math.abs(av||0))*1.1||1);let hw='',aw='';

  return`<div class="urow"><div class="us h ${hw}"><span class="v">${hv==null||isNaN(hv)?'n/a':fmt(hv)}</span><span class="k">${bar(hv)}</span></div><div class="l">${label}${sub?`<em>${sub}</em>`:''}</div><div class="us a ${aw}"><span class="v">${av==null||isNaN(av)?'n/a':fmt(av)}</span><span class="k">${bar(av)}</span></div></div>`}

const w0open=()=>{try{return localStorage.getItem('cwin')==='0'?'':' open'}catch(e){return' open'}};

  <div class="gwrap"><div class="gstrip" id="gstrip" role="group" aria-label="Games">${days.map(d=>`<div class="gday"><b>${dt(d).toLocaleDateString('en-US',{weekday:'short'})}</b><small>${md(d)}</small></div>`+gs.filter(g=>g.date===d).map(tile).join('')).join('')}</div></div>

function sel(sl){const g=G.find(x=>slug(x.id)===sl);if(!g)return;
  document.querySelectorAll('#gstrip [data-g]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===sl));
  const tb=document.querySelector(`#gstrip [data-g="${sl}"]`),st=$('#gstrip');if(tb)st.scrollTo({left:tb.offsetLeft-st.offsetLeft-(st.clientWidth-tb.offsetWidth)/2,behavior:'smooth'});
  const box=$('#gdetail'),ln=`<dl class="ln dl2"><div><dt>Market</dt><dd>${g.spread==null?'<span class="nl">No line yet</span>':spread(g)+(g.total!=null?` · O/U ${g.total}`:'')}</dd></div><div><dt>Our line</dt><dd>${ourline(g)} · ${f1(g.mh+g.ma)}</dd></div><div><dt>Kickoff</dt><dd>${g.day} ${hm(g.time)} ET</dd></div><div><dt>Stadium</dt><dd>${esc(g.stadium||'–')}</dd></div></dl>`;

  else{const why=g.status==='final'?'This game was played before Game Books were being built, so only the result and our pre-game numbers are kept.':g.status==='lines'?'The full Game Book (simulation, player forecasts, picks) is built on game week, after the injury reports. Until then this is the market-based projection.':'No market line yet, so this is our ratings-only projection. It will move once lines post and the Game Book is built on game week.';
    box.innerHTML=`<div class="gdbar"><span class="sd ${g.status}">${ST[g.status]}</span><b>${g.away} at ${g.home}</b></div>${g.status==='final'&&revget(`nfl:${g.away}@${g.home}`)?revhtml(revget(`nfl:${g.away}@${g.home}`)):''}${matchup(g.away,g.home,g)}${ln}<p class="note">${why}</p>`}}

/* Game Books load into a shadow root so their own styles cannot touch the hub's, and vice versa */
const BOOKS=new Map();
async function bookDoc(file){if(!BOOKS.has(file))BOOKS.set(file,fetch(file).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>{const d=new DOMParser().parseFromString(t,'text/html');
  const css=[...d.querySelectorAll('style')].map(x=>x.textContent).join('\n').replace(/:root/g,':host');return{d,css}}));return BOOKS.get(file)}
async function book(g,host=$('#gbhost')){const[file,id]=g.report.split('#');
  try{const{d,css}=await bookDoc(file);if(!host.isConnected)return;const art=d.getElementById(id);if(!art)throw new Error('game not found in '+file);
    const root=host.shadowRoot||host.attachShadow({mode:'open'});
    root.innerHTML=`<style>${css}\n:host{display:block;color:var(--fg);font:15px/1.55 var(--b)}[hidden]{display:none!important}.game>.gh{display:none}</style>`;
    const a=art.cloneNode(true);a.hidden=false;root.appendChild(a);host.firstElementChild&&host.firstElementChild.tagName==='P'&&host.firstElementChild.remove();wire(root);revtab(root,g.away&&g.home?`nfl:${g.away}@${g.home}`:'cfb:'+g.id)}
  catch(e){host.innerHTML=`<p class="empty">The Game Book did not load (${esc(e.message)}). <a href="${esc(g.report)}">Open it as its own page</a>.</p>`}}
function wire(r){const T=[...r.querySelectorAll('.gt')],P=[...r.querySelectorAll('.pane')];
  const s=id=>{P.forEach(p=>p.hidden=p.id!==id);T.forEach(b=>b.setAttribute('aria-selected',b.dataset.p===id))};T.forEach(b=>b.onclick=()=>s(b.dataset.p));if(T.length)s(T[0].dataset.p);
  P.forEach(p=>{const S=[...p.querySelectorAll('.sb')],U=[...p.querySelectorAll('.sub')];if(!S.length)return;const f=id=>{U.forEach(u=>u.hidden=u.id!==id);S.forEach(b=>b.setAttribute('aria-selected',b.dataset.s===id))};S.forEach(b=>b.onclick=()=>f(b.dataset.s));f(S[0].dataset.s)});
  r.querySelectorAll('[data-tab]').forEach(a=>a.onclick=()=>{s(a.dataset.tab);const b=a.dataset.sub&&r.querySelector('.sb[data-s="'+a.dataset.sub+'"]');if(b)b.click();const g=r.querySelector('.gtabs');if(g)g.scrollIntoView({block:'start'})});
  r.querySelectorAll('[data-dlg]').forEach(b=>b.onclick=()=>{const d=r.getElementById?r.getElementById(b.dataset.dlg):r.querySelector('[id="'+b.dataset.dlg+'"]');if(d)d.showModal()});
  r.querySelectorAll('dialog.h2d').forEach(d=>{d.onclick=e=>{if(e.target===d)d.close()};const x=d.querySelector('[data-close]');if(x)x.onclick=()=>d.close()});
  r.querySelectorAll('select[data-win]').forEach(x=>{const box=x.closest('.mblock'),f=()=>box.querySelectorAll('[data-w]').forEach(d=>d.hidden=d.dataset.w!==x.value);x.onchange=f;f()});
  r.querySelectorAll('.om').forEach(o=>{const B=[...o.querySelectorAll('[data-om]')],f=k=>{o.querySelectorAll('[data-omv]').forEach(d=>d.hidden=d.dataset.omv!==k);B.forEach(b=>b.setAttribute('aria-pressed',b.dataset.om===k))};B.forEach(b=>b.onclick=()=>f(b.dataset.om));if(B.length)f('sp')})}
function toggle(b){
  const g=G.find(x=>x.id===b.dataset.sbs),box=$('#sbs-'+g.date),open=b.getAttribute('aria-expanded')==='true';

/* ---- side by side: away (or the left team) always on the left ---- */
function mrow(lab,lv,rv,lr,rr,tip){
  const better=lr==null||rr==null||lr===rr?null:lr<rr?'l':'r';
  const side=(v,r,c)=>`<div class="${c}${better===c?' win':''}"><span class="v">${v}${r!=null?`<i>#${r}</i>`:''}</span>${r!=null?`<span class="bar"><span style="width:${((33-r)/32*100).toFixed(0)}%"></span></span>`:'<span></span>'}</div>`;
  return`<div class="mrow"${tip?` title="${esc(tip)}"`:''}>${side(lv,lr,'l')}<div class="lab">${lab}</div>${side(rv,rr,'r')}</div>`}
const UNIT={off:['offense','gains'],def:['defense','allows']},SUBLAB={to:'offense loses · defense forces',sacks:'offense allows · defense makes'};
const sidehead=(lt,ls,rt,rs)=>`<div class="mcols"><div class="l"><b>${lt} ${UNIT[ls][0]}</b><small>what ${lt} ${UNIT[ls][1]}</small></div><div class="lab">2026 season average<br># = league rank, 1 is best</div><div class="r"><b>${rt} ${UNIT[rs][0]}</b><small>what ${rt} ${UNIT[rs][1]}</small></div></div>`;
function units(lt,ls,rt,rs){return sidehead(lt,ls,rt,rs)+D.metrics.map(m=>{const a=T[lt].unit[ls][m.key],b=T[rt].unit[rs][m.key];
  return mrow(m.label+(SUBLAB[m.key]?`<small>${SUBLAB[m.key]}</small>`:''),fmt(a.v,m.fmt),fmt(b.v,m.fmt),a.r,b.r,`Last 3 games: ${lt} ${fmt(a.l3,m.fmt)}, ${rt} ${fmt(b.l3,m.fmt)}`)}).join('')}
const UNOTE='Green is the better-ranked unit in that row. It compares season form, not a projection for this game, and is not adjusted for opponents faced. Hover a row for the last 3 games.';
function matchup(a,h,g){
  const A=T[a],H=T[h];let pa,ph,pw,sub;
  if(g){pa=g.status==='final'?g.sa:f1(g.ba);ph=g.status==='final'?g.sh:f1(g.bh);pw=g.ph;sub=g.status==='final'?`Final · projected ${f1(g.ba)}–${f1(g.bh)}`:`${ST[g.status]} · market ${spread(g)}${g.total!=null?`, O/U ${g.total}`:''}`}
  else{const xa=D.mu+A.adj_off-H.adj_def,xh=D.mu+H.adj_off-A.adj_def;pa=f1(xa);ph=f1(xh);pw=phi((xh-xa)/D.sd);sub=`Neutral field, our ratings only · fair odds ${a} ${am(1-pw)}, ${h} ${am(pw)}`}
  return`<div class="mhead"><div class="tm"><b>${a}</b><span>${esc(A.name)} · ${A.rec}</span></div>
  <div class="mid"><div class="pts"><b>${pa}</b><small>${g&&g.status==='final'?'final':'projected'}</small><b>${ph}</b></div>
  ${wbar(pw)}<small>Win chance ${a} ${pc(1-pw)} · ${h} ${pc(pw)}</small><small>${esc(sub)}</small></div>
  <div class="tm r"><b>${h}</b><span>${esc(H.name)} · ${H.rec}</span></div></div>
  <section class="mblock"><h4>Strength <span class="kind pred">Predictive</span></h4>
  ${mrow('Adjusted offense, pts vs avg',sg(A.adj_off),sg(H.adj_off),A.adj_off_r,H.adj_off_r)}${mrow('Adjusted defense, pts vs avg',sg(A.adj_def),sg(H.adj_def),A.adj_def_r,H.adj_def_r)}
  <p class="note">Opponent-adjusted points per game from the model's ratings; rank 1 is best. These drive our line.</p></section>
  <section class="mblock"><h4>When ${a} has the ball <span class="kind ctx">Context</span></h4>${units(a,'off',h,'def')}<p class="note">${UNOTE}</p></section>
  <section class="mblock"><h4>When ${h} has the ball <span class="kind ctx">Context</span></h4>${units(a,'def',h,'off')}<p class="note">${UNOTE}</p></section>
  ${g&&g.report?`<p><a class="btn fill" href="${esc(g.report)}">Open the full Game Book</a></p>`:''}`}

/* ---- compare any two teams ---- */
(function(){const ts=Object.keys(T).sort(),g0=G.find(g=>g.week===D.week&&g.status!=='final')||G.find(g=>g.week===D.week);
  const opt=s=>ts.map(t=>`<option value="${t}"${t===s?' selected':''}>${t} ${esc(T[t].name)}</option>`).join('');

/* ---- track record ---- */
(function(){const t=D.track;let h=`<h2>Track record</h2><p class="note">Scored after each week by the Tuesday review. Calibration means a 70% call should land about 70% of the time.</p>`;
  const gr=t.games,gn=gr.reduce((s,x)=>s+x.n,0),gw=gr.reduce((s,x)=>s+x.right,0);
  h+=`<div class="kpis">`;
  if(t.likely)h+=`<div class="kpi"><small>Most likely tier · 70%+ · live</small><b>${pc(t.likely.hit,1)}</b><p>hit on ${t.likely.n} calls vs ${pc(t.likely.pred,1)} predicted (±${pc(t.likely.moe,1)})</p></div>`;
  if(gn)h+=`<div class="kpi"><small>Pre-game winner picks</small><b>${gw}-${gn-gw}</b><p>${pc(gw/gn,1)} right · mostly the market favorite, since the score is 90% market</p></div>`;
  if(t.clv)h+=`<div class="kpi"><small>Closing line value · value-tier props</small><b>${t.clv.props_mean==null?'–':sg(t.clv.props_mean)}</b><p>${t.clv.props_n} picks, ${pc(t.clv.props_pos)} moved our way. Positive means the line moved toward us.</p></div>`;
  h+=`</div>`;
  const RU=D.rules;if(RU){const f=x=>!x||!x.n?'–':`${pc(x.pct,1)} <small>of ${x.n.toLocaleString()}</small>`,u=x=>!x||!x.n?'–':`<span class="${x.units>0?'w':'l'}">${(x.units>0?'+':'')+x.units.toFixed(1)}u</span>`,am=a=>a==null?'':(a>0?'+':'')+a;
    const lv=k=>(RU.live||[]).find(x=>x.rule===k)||{};
    h+=`<section class="mblock"><h4>Spread rules, tracked live <span class="kind ctx">leads, not proven</span></h4>
    <p class="note">The five-season study found no team-stat model that beats the spread. What did cover a little more than half the time were these market patterns. Each pick is logged before kickoff at the line on offer and graded at that line. A bettor needs ${pc(RU.need,1)} at −110 to break even, and none of these has cleared that with room to spare.</p>
    <div class="tw"><table><thead><tr><th>Rule</th><th>Live record</th><th>Live units</th><th>Waiting</th><th>2026 at the close</th><th>2021–25</th><th>2006–20</th></tr></thead><tbody>${RU.hist.map(x=>{const L=lv(x.rule);return`<tr><td>${esc(x.label)}</td><td>${L.n?`${L.w}-${L.n-L.w} <small>(${pc(L.pct)})</small>`:'–'}</td><td>${u(L)}</td><td>${L.open||0}</td><td>${f(x.now)} ${u(x.now)}</td><td>${f(x.five)} ${u(x.five)}</td><td>${f(x.long)} ${u(x.long)}</td></tr>`}).join('')}</tbody></table></div>
    ${RU.week.picks.length?`<h5 class="rh5">${esc(wname(RU.week.n))} picks under these rules</h5><div class="tw"><table><thead><tr><th>Team</th><th>Line</th><th>Price</th><th>Against</th><th>Why</th></tr></thead><tbody>${RU.week.picks.map(p=>`<tr><td><b>${p.team}</b></td><td>${p.line>0?'+':''}${p.line}</td><td>${am(p.price)}</td><td>${p.opp}</td><td style="text-align:left;white-space:normal">${p.rules.map(esc).join('; ')}</td></tr>`).join('')}</tbody></table></div>`:''}
    <p class="note">"Live" counts only picks logged before kickoff, starting ${esc(wname(RU.week.n||D.week))}. "At the close" applies the rule to the closing line after the fact. Units are flat 1-unit bets at the listed price. The quarterback rule uses the newest depth chart and is dropped if the usual quarterback starts after all.</p></section>`}
  if(t.bands.length){h+=`<section class="mblock"><h4>Calibration · every scored player forecast</h4><div class="tw"><table><thead><tr><th>Model said</th><th>Forecasts</th><th>Predicted</th><th>Hit</th><th style="width:40%">Predicted vs hit</th></tr></thead><tbody>${t.bands.map(b=>`<tr><td>${b.band}</td><td>${b.n}</td><td>${pc(b.pred,1)}</td><td>${pc(b.hit,1)}</td><td><span class="hb p" style="width:${(b.pred*100).toFixed(0)}%"></span><span class="hb" style="width:${(b.hit*100).toFixed(0)}%"></span></td></tr>`).join('')}</tbody></table></div><p class="note">Grey bar is predicted, green is what happened. Close bars mean honest probabilities.</p></section>`}

  const draw=()=>{L.hidden=!hits.length;L.innerHTML=hits.map((p,i)=>`<li><button type="button" data-id="${p.id}" class="${i===on?'on':''}">${badge(p.pos)}<span>${esc(p.n)}</span><small>${p.tm} · ${p.g[0][PC.s]}–${p.g[p.g.length-1][PC.s]}</small></button></li>`).join('');
    L.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();go(b.dataset.id)})};
  const go=id=>{q.value='';hits=[];draw();q.blur();location.hash='player-'+id};
  q.oninput=()=>{if(!PD)return;const t=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);on=0;
    hits=!t.length?[]:PD.players.filter(p=>{const n=p.n.toLowerCase();return t.every(x=>n.includes(x))||(t.length===1&&p.tm.toLowerCase()===t[0])})
      .sort((a,b)=>(b.n.toLowerCase().startsWith(t[0])-a.n.toLowerCase().startsWith(t[0])))
      .slice(0,10);draw()};
  q.onkeydown=e=>{if(!hits.length)return;if(e.key==='ArrowDown'){on=(on+1)%hits.length;draw();e.preventDefault()}else if(e.key==='ArrowUp'){on=(on-1+hits.length)%hits.length;draw();e.preventDefault()}
    else if(e.key==='Enter'){go(hits[on].id)}else if(e.key==='Escape'){hits=[];draw()}};
  q.onblur=()=>setTimeout(()=>{hits=[];draw()},120)}

function planding(){const y=PD.through.season;

  $('#pbody').innerHTML=`<div class="chips" role="group" aria-label="Position">${['ALL','QB','RB','WR','TE'].map(k=>`<button class="chip" data-c="${k}" aria-pressed="${k===pchip}">${k==='ALL'?'All':k}</button>`).join('')}</div>

function tiles(rs,pos){const n=rs.length,g=k=>div(sum(rs,k),n),t=(lab,v,sub,k)=>`<div class="tile${k?' k':''}"><small>${lab}</small><b>${v}</b><span>${sub||''}</span></div>`;

    +t('Completion %',sum(rs,'att')?pc(sum(rs,'cmp')/sum(rs,'att'),1):'–',`${sum(rs,'cmp')}/${sum(rs,'att')}`)+t('Yards / attempt',div(sum(rs,'py'),sum(rs,'att')),'')+t('Rush yds / g',g('ry'),`${sum(rs,'rtd')} rush TD`);
  else if(pos==='RB')h=t('Rush yds / g',g('ry'),`${sum(rs,'ry').toLocaleString()} total`,1)+t('Carries / g',g('car'),`${div(sum(rs,'ry'),sum(rs,'car'))} YPC`)+t('Rec yds / g',g('ryd'),`${sum(rs,'rec')} catches`)
    +t('Targets / g',g('tgt'),'')+t('Scrimmage yds / g',g('scr'),'')+t('TD / g',div(td,n,2),`${td} rush + rec TD`);
  else h=t('Rec yds / g',g('ryd'),`${sum(rs,'ryd').toLocaleString()} total`,1)+t('Receptions / g',g('rec'),`${div(sum(rs,'ryd'),sum(rs,'rec'))} Y/R`)+t('Targets / g',g('tgt'),`${sum(rs,'tgt')} total`)
    +t('Catch rate',sum(rs,'tgt')?pc(sum(rs,'rec')/sum(rs,'tgt'),1):'–','')+t('Target share',cell(rs,'tsh'),'avg per game')+t('TD / g',div(td,n,2),`${td} rush + rec TD`);
  return`<div class="tiles">${t('Games',n,'in this view')}${h}${t('PPR pts / g',div(sum(rs,'fp'),n),'')}</div>`}

function chart(rs,k,line){if(!rs.length)return'';const W=760,H=200,pl=34,pr=8,pt=14,pb=26,n=rs.length,vals=rs.map(r=>pv(r,k));
  const mx=Math.max(1,...vals,line||0)*1.08,bw=(W-pl-pr)/n,y=v=>pt+(1-v/mx)*(H-pt-pb),av=vals.reduce((a,b)=>a+b,0)/n;
  let g='';[0,.5,1].forEach(f=>{const v=mx*f/1.08;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${k==='fp'?v.toFixed(0):Math.round(v)}</text>`});
  rs.forEach((r,i)=>{const v=vals[i],x=pl+i*bw,ok=line==null||line===''?true:v>=line;
    g+=`<rect x="${(x+bw*.15).toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(bw*.7,1).toFixed(1)}" height="${Math.max(H-pb-y(v),0).toFixed(1)}" rx="${Math.min(2,bw*.2).toFixed(1)}" fill="${ok?'var(--grn)':'var(--red)'}" fill-opacity="${ok?.9:.6}"><title>${glab(r)} ${vsl(r)}: ${k==='fp'?v.toFixed(1):v} ${SL[k]}</title></rect>`;
    if(i===0||rs[i-1][PC.s]!==r[PC.s])g+=`<text x="${(x+2).toFixed(1)}" y="${H-8}">${r[PC.s]}</text><line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${pt}" y2="${H-pb+4}" stroke="var(--line2)" stroke-dasharray="2 3"/>`});
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(av)}" y2="${y(av)}" stroke="var(--fg)" stroke-dasharray="5 4" opacity=".7"/><text class="av" x="${W-pr}" y="${y(av)-4}" text-anchor="end">avg ${av.toFixed(1)}</text>`;
  if(line!=null&&line!=='')g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(line)}" y2="${y(line)}" stroke="var(--red)" stroke-width="1.5"/>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(SL[k])} by game">${g}</svg>`}

    ${ln!=null&&rs.length?`<p class="hit">Cleared ${ln}+ ${esc(SL[PS.stat])} in <b>${hit} of ${rs.length}</b> games (${pc(hit/rs.length)}) · last ${l10.length}: <b>${h10} of ${l10.length}</b></p>`:`<p class="note">Type a line to see how often he cleared it in the games shown. Past hit rates are context, not a forecast: they ignore role changes, injuries and the opponent.</p>`}</section>`;
  // vs every opponent

   <g class="cln"><path d="${arc}" fill="none"/><rect x="170" y="0" width="160" height="190" fill="none"/><circle cx="250" cy="190" r="60" fill="none"/><path d="M210 52 A40 40 0 0 0 290 52" fill="none"/><circle cx="250" cy="52" r="7.5" fill="none"/><line x1="220" y1="40" x2="280" y2="40"/></g>
   ${tx(250,30,'RA')}${tx(250,140,'PNT')}${tx(95,215,'MID')}${tx(52,70,'LC3')}${tx(448,70,'RC3')}${tx(250,330,'AB3')}</svg>`}
function nbmx(p,G){const M=NBM,pos=pgrp(p),o=p.o,mk=NPS.mk,parts=MKP[mk]||['pts'],per=NMX.per,pi={s:1,l7:2,l15:3}[per];

  /* 1. defense vs position */
  if(D0){const sum=t=>parts.reduce((a,k)=>a+((dv[t]||{})[k]||[0])[0],0),order=Object.keys(dv).sort((a,b)=>sum(a)-sum(b)),rk=order.indexOf(o)+1,v=sum(o);

    h+=`<section class="mxc"><h4>${esc(nbt(o).short)} defense vs ${PGN[pos]}</h4>
    <div class="mxban ${good?'rw':mid?'rm':'re'}"><b>${good?'Favorable':mid?'Neutral':'Tough'} matchup</b><span>${esc(o)} allows ${f1(v)} ${parts.map(k=>MKS[k]).join('+')} per game to ${PGN[pos]} (all ${PGN[pos]} combined) — #${rk} of ${order.length}${rk>=21?' (one of the weakest)':rk<=10?' (one of the stingiest)':''}</span></div>
    <div class="mxtab">${[['s','Season'],['l7','L7'],['l15','L15']].map(([k,l])=>`<button data-mper="${k}" aria-pressed="${per===k}">${l}</button>`).join('')}</div>
    <table class="mxt"><thead><tr><th>Stat</th><th>Avg / game</th><th class="${per==='s'?'on':''}">SZN</th><th class="${per==='l7'?'on':''}">L7</th><th class="${per==='l15'?'on':''}">L15</th></tr></thead><tbody>
    ${M.dvk.map(([k,l])=>{const r=D0[k];if(!r)return'';const pct=k==='fgp'||k==='ftp',hit=parts.includes(k);return`<tr class="${hit?'hit':''}"><td>${l}<i class="mxb ${rkc(r[pi])}" style="width:${(r[pi]||0)/30*100}%"></i></td><td class="mono">${pct?(r[0]*100).toFixed(1)+'%':f1(r[0])}</td><td>${rkb(r[1])}</td><td>${rkb(r[2])}</td><td>${rkb(r[3])}</td></tr>`}).join('')}</tbody></table>
    <p class="note">Rank 30 = gives up the most to ${PGN[pos]} (best for ${esc(p.n.split(' ').slice(-1)[0])}), 1 = gives up the least. Turnovers: 30 = forces the fewest. ${NBM.season-1}-${String(NBM.season).slice(2)} regular season through ${new Date(NBM.through+'T12:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}.</p></section>`}
  /* 2. zones: one court, toggled between his scoring and the opponent's zone defense */
  const Z=M.pz[p.id],T=M.tz[o],zv=T?NMX.zv:'me',ln=esc(p.n.split(' ').slice(-1)[0]);
  if(Z){const fga=M.zones.reduce((a,[k])=>a+(Z[k]?Z[k][0]:0),0),pts=M.zones.reduce((a,[k])=>a+(Z[k]?Z[k][2]:0),0)+(Z.FT?Z.FT[2]:0);
    const sh=k=>Z[k]&&fga?Z[k][0]/fga:0,ps=k=>Z[k]&&pts?Z[k][2]/pts:0,fg=k=>Z[k]&&Z[k][0]?Z[k][1]/Z[k][0]:null;
    const mx=Math.max(...M.zones.map(([k])=>sh(k)),.01),C={};
    const lg=k=>{let a=0,m=0;for(const t in M.tz){const r=M.tz[t][k];if(r&&r[1]!=null){a+=r[2];m+=r[2]*r[1]}}return a?m/a:null};
    const zc=k=>{const v=ps(k);return v>=.25?'color-mix(in srgb,var(--grn) 38%,var(--bg))':v>=.10?'color-mix(in srgb,#e3a008 34%,var(--bg))':'color-mix(in srgb,var(--red) 32%,var(--bg))'};
    if(zv==='me')M.zones.forEach(([k])=>{C[k]={f:zc(k),t:pc(ps(k)),b:Z[k]?`${Z[k][2]} pts · ${Z[k][1]}/${Z[k][0]}`:'0 pts'}});
    else M.zones.forEach(([k])=>{const r=T[k];C[k]={f:r?(r[3]>=21?'color-mix(in srgb,var(--grn) 38%,var(--bg))':r[3]>=11?'color-mix(in srgb,#e3a008 34%,var(--bg))':'color-mix(in srgb,var(--red) 32%,var(--bg))'):'var(--pan2)',t:r?'#'+r[3]:'–',b:r?`${f1(r[0])}/g · ${r[1]==null?'–':pc(r[1])}`:''}});
    h+=`<section class="mxc"><h4>Scoring zones</h4>
    ${T?`<div class="mxtab">${[['me',ln+'’s scoring'],['def',esc(nbt(o).short)+' defense']].map(([k,l])=>`<button data-mzv="${k}" aria-pressed="${zv===k}">${l}</button>`).join('')}</div>`:''}
    ${nbcourt(C,zv==='me'?'His shots by zone':'Opponent zone defense')}
    ${zv==='me'?`<div class="mxleg"><span><i class="rw"></i>25%+ of his points</span><span><i class="rm"></i>10–25%</span><span><i class="re"></i>under 10%</span></div><p class="note">Big number: share of his points that come from that zone (free throws count toward the total). Small: points scored there · makes/attempts. Green = where he does most of his scoring. ${fga} shots in ${Z.g} games this season${Z.FT?`, plus ${Z.FT[1]}/${Z.FT[0]} free throws (${pc(ps('FT'))} of his points)`:''}.</p>`
     :`<div class="mxleg"><span><i class="rw"></i>#21–30 weak</span><span><i class="rm"></i>#11–20 mid</span><span><i class="re"></i>#1–10 stingy</span></div><p class="note">${esc(o)}’s rank in each zone by points allowed per game (all opponents; #30 = allows the most). Small: points allowed per game · FG% allowed there.</p>`}
    ${T?`<table class="mxt mxz"><thead><tr><th>Zone</th><th>His pts</th><th>His FG%</th><th>${esc(o)} allows</th><th>Def</th></tr></thead><tbody>
      ${M.zones.slice().sort((a,b)=>ps(b[0])-ps(a[0])).map(([k,l])=>{const r=T[k];return`<tr><td>${l}<i class="mxb ${r?rkc(r[3]):''}" style="width:${ps(k)*100}%"></i></td><td class="mono">${pc(ps(k))}</td><td class="mono">${fg(k)==null?'–':pc(fg(k))}</td><td class="mono">${r?f1(r[0])+'/g':'–'}</td><td>${rkb(r&&r[3])}</td></tr>`}).join('')}
      ${Z.FT?`<tr><td>Free throws<i class="mxb" style="width:${ps('FT')*100}%"></i></td><td class="mono">${pc(ps('FT'))}</td><td class="mono">${Z.FT[0]?pc(Z.FT[1]/Z.FT[0]):'–'}</td><td class="mono">–</td><td>${rkb(null)}</td></tr>`:''}</tbody></table>`:''}</section>`}
  else h+=`<section class="mxc"><h4>Scoring zones</h4><p class="empty">No shots logged for him this season yet.</p></section>`;
  /* 4. similar players vs this team */
  const K=M.simk,mi=K.indexOf(mk==='dd'?'pts':mk),A=M.avg,me=A[p.id],myv=me?me[5+mi]:null,rows=(M.og[o]||[]).filter(r=>r[0]!==p.id&&A[r[0]]&&A[r[0]][1]===pos&&r[3]>=10);
  const sim=NMX.sim==='sim'&&myv!=null?rows.filter(r=>{const a=A[r[0]][5+mi];return Math.abs(a-myv)<=Math.max(2,myv*.3)&&A[r[0]][4]>=Math.max(12,(me[4]||0)-10)}):rows;

   ${n?`<p class="mxsum">vs line <b class="${ad>0?'w':'l'}">${ad>0?'+':''}${f1(ad)}</b> per game · over in <b>${ov}/${n}</b> (${pc(ov/n)})</p>`:''}
   <div class="mxl">${n?L.map(x=>{const q=A[x.r[0]],pp={id:x.r[0],n:q[0],t:x.r[2]};return`<div class="mxr">${face(pp)}<div class="mxn"><b>${esc(q[0])}</b><small>${x.r[2]} · ${x.r[1].replace('-','/')} · ${x.r[3]} min</small></div>

     <span class="mxd ${x.d>0?'o':x.d<0?'u':''}">${x.d>0?'↑ +':x.d<0?'↓ ':''}${f1(x.d)}</span></div>`}).join(''):`<p class="empty">No ${NMX.sim==='sim'?'similar ':''}${PGN[pos]} have played ${esc(o)} this season yet.</p>`}</div>
   <p class="note">${NMX.sim==='sim'?`${PGN[pos][0].toUpperCase()+PGN[pos].slice(1)} whose season average in this stat is within 30% of his (${myv==null?'–':f1(myv)}), 10+ minutes that night.`:`Every ${PGN[pos].slice(0,-1)} with 10+ minutes against ${esc(o)}.`} Compared with DraftKings’ main line for that game when there was one, otherwise his season average (“avg”). This season only, newest first.</p></section>`;
  return h+'</div>'}
function nbmxwire(p,G){const b=$('#nbmx');if(!b||!NBM)return;

/* ---------- NBA previous weeks: finished games by week (Mon-Sun), by day, with post-game reviews and a search ---------- */
let NBW=null,NBWP=null;const NW={wk:null,q:''};
function nbaweeks(wk){const box=$('#v-nba-weeks');if(!box.dataset.ready){box.dataset.ready=1;box.innerHTML='<p class="note">Loading the season…</p>'}

  Promise.all([NBWP,nbload()]).then(([j])=>{NBW=j;const last=Math.max(...j.games.map(g=>g.wk));NW.wk=wk&&wk<=last?wk:(NW.wk||last);nbwdraw()}).catch(e=>{box.innerHTML=`<p class="empty">Past games did not load (${esc(e.message)}).</p>`})}
function nbwdraw(){const box=$('#v-nba-weeks'),A=NBW.games,weeks=[...new Set(A.map(g=>g.wk))].sort((a,b)=>a-b),d0=new Date(NBW.start+'T12:00:00'),day=s=>new Date(s+'T12:00:00');

  const L=q?A.filter(hit).slice().reverse().slice(0,60):A.filter(g=>g.wk===NW.wk),days=[...new Set(L.map(g=>g.date))];if(!q)days.sort();
  const row=g=>{const hw=g.hs>g.as_;return`<details class="pwg"><summary><span class="pt ${hw?'':'w'}"><b>${esc(g.away)}</b> ${g.as_}</span><span class="at">at</span><span class="pt ${hw?'w':''}"><b>${esc(g.home)}</b> ${g.hs}</span><small>${esc(tn(g.away))} at ${esc(tn(g.home))}${g.cover?` · ${esc(g.cover)} covered`:''}${g.ou&&g.ou!=='push'?` · ${g.ou}`:''}</small></summary><div data-pw="${g.id}"></div></details>`};
  box.innerHTML=`<div class="pl-head"><h2>Previous weeks</h2><span class="note">NBA ${esc(NB.season||'')} · ${A.length} finished games · weeks run Monday to Sunday</span></div>
   <div class="search"><input id="pwq" type="search" value="${esc(NW.q)}" placeholder="Search a game: team, city or date (e.g. Lakers, PHI BOS, Nov 4)" aria-label="Search games"></div>
   ${q?`<p class="note">${L.length} game${L.length===1?'':'s'} match “${esc(NW.q)}”, newest first${L.length===60?' (first 60 shown)':''}.</p>`:`<div class="wstrip pww" role="group" aria-label="Week">${weeks.map(w=>`<button data-pw-wk="${w}" aria-pressed="${w===NW.wk}">W${w}<small>${wlab(w)}</small></button>`).join('')}</div>`}
   ${days.map(d=>`<div class="day">${day(d).toLocaleDateString('en-US',{weekday:'long'})}<small>${day(d).toLocaleDateString('en-US',{month:'short',day:'numeric'})}${q?' · week '+L.find(g=>g.date===d).wk:''}</small></div><div class="pwl">${L.filter(g=>g.date===d).map(row).join('')}</div>`).join('')||'<p class="empty">No games found.</p>'}
   <p class="note">Open a game for its post-game review: the winner and their price, whether they covered, the total, and each team's leaders. Lines are DraftKings' closing numbers.</p>`;
  box.querySelectorAll('[data-pw-wk]').forEach(b=>b.onclick=()=>{NW.wk=+b.dataset.pwWk;history.replaceState(null,'','#nba-week-'+NW.wk);nbwdraw()});
  const sel=box.querySelector('.pww [aria-pressed=true]');if(sel){const s=box.querySelector('.pww');s.scrollLeft=sel.offsetLeft-s.offsetLeft-(s.clientWidth-sel.offsetWidth)/2}
  box.querySelectorAll('details.pwg').forEach(dt=>dt.addEventListener('toggle',()=>{const h=dt.querySelector('[data-pw]');if(dt.open&&!h.innerHTML){const g=A.find(x=>x.id===h.dataset.pw);h.innerHTML=revhtml(g)+`<p><a class="lk" href="#nba-game-${g.id}" hidden></a></p>`}}));
  const qi=$('#pwq');qi.oninput=()=>{clearTimeout(qi._t);qi._t=setTimeout(()=>{NW.q=qi.value;nbwdraw();const n=$('#pwq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)}}
function nbarecord(){const box=$('#v-nba-record');if(!box.dataset.ready){box.dataset.ready=1;box.innerHTML=`<p class="note">Loading…</p>`}
  nbwrap('#v-nba-record',()=>{const R=NB.record,bt=R.bt,days=R.days;
    const sum=k=>{const o={};for(const d of days)for(const b of d.bands){o[b.band]=o[b.band]||{n:0,h:0};o[b.band].n+=b.n;o[b.band].h+=b.hits}return o},S=sum();
    const hi=['90%+','80–90%','70–80%'].reduce((a,k)=>({n:a.n+(S[k]?.n||0),h:a.h+(S[k]?.h||0)}),{n:0,h:0});
    const gr=days.reduce((s,d)=>s+d.gr,0),gn=days.reduce((s,d)=>s+d.gn,0);
    const btab=rows=>`<div class="tw"><table><thead><tr><th>We said</th><th>Lines</th><th>Hit</th><th>Hit rate</th><th>Average said</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${b.band}</td><td>${b.n.toLocaleString()}</td><td>${b.hits.toLocaleString()}</td><td>${b.n?pc(b.hits/b.n,1):'–'}</td><td>${b.said==null?'–':pc(b.said,1)}</td></tr>`).join('')}</tbody></table></div>`;
    const E=R.edge,LV=R.live,sg=v=>v==null?'–':(v>0?'+':'')+(v*100).toFixed(1)+'%',rng=t=>t.roi_lo==null?'':` <small>(${sg(t.roi_lo)} to ${sg(t.roi_hi)})</small>`;
    const prow=(lab,t,clv)=>!t||!t.n?`<tr><td>${lab}</td><td colspan="${clv?7:6}" class="note">None yet.</td></tr>`:`<tr><td>${lab}</td><td>${t.n.toLocaleString()}</td><td>${t.games}</td><td>${pc(t.hit,1)}</td><td>${pc(t.need,1)}</td><td>${(t.units>0?'+':'')+t.units.toFixed(1)}</td><td class="${t.roi>0?'w':'l'}"><b>${sg(t.roi)}</b>${rng(t)}</td>${clv?`<td>${t.clv&&t.clv.n?pc(t.clv.beat)+` <small>of ${t.clv.n.toLocaleString()}</small>`:'–'}</td>`:''}</tr>`;
    const phead=clv=>`<thead><tr><th>Bets</th><th>Count</th><th>Games</th><th>Hit</th><th>Needed</th><th>Units</th><th>Return per bet</th>${clv?'<th>Beat the close</th>':''}</tr></thead>`;
    const priced=E?`<section class="mblock"><h4>At real prices: the out-of-sample test <span class="kind ctx">${E.games} games</span></h4>
    <p><b>No proven edge yet.</b> Betting the side the model prefers on every DraftKings over/under returned <b>${sg(E.model_side.roi)}</b> per bet${rng(E.model_side)}. That is better than betting blind (${sg(E.all_sides.roi)}, the sportsbook's cut), but still a loss. Our probability is no sharper than DraftKings' own: log loss ${E.logloss.blend.toFixed(4)} against ${E.logloss.dk.toFixed(4)} on ${E.logloss.n.toLocaleString()} lines (lower is better).</p>
    <div class="tw"><table>${phead(false)}<tbody>${prow('Every over and every under',E.all_sides)}${prow("The model's side on every over/under",E.model_side)}${prow(`Only when it claims ${pc(E.edge_min)}+ value`,E.edge_picks)}${prow('Every DraftKings "N+" line',E.mile_all)}</tbody></table></div>
    <p class="note">${md(E.from_.replaceAll('-',''))} to ${md(E.to.replaceAll('-',''))}, flat 1-unit bets at the DraftKings price on file. The price blend was fit only on games before ${md(E.split.replaceAll('-',''))}. "Needed" is the hit rate the prices require. Ranges are 80% intervals from resampling whole games, because bets on one game rise and fall together. Prices longer than −900 are left out.</p>
    <details class="fold"><summary>When the model claimed an edge, what happened?</summary><div class="tw"><table><thead><tr><th>Claimed value per bet</th><th>Over/unders</th><th>Hit</th><th>Needed</th><th>Return per bet</th></tr></thead><tbody>${E.by_claim.line.filter(t=>t.n).map(t=>`<tr><td>${t.bucket}</td><td>${t.n.toLocaleString()}</td><td>${pc(t.hit,1)}</td><td>${pc(t.need,1)}</td><td class="${t.roi>0?'w':'l'}"><b>${sg(t.roi)}</b>${rng(t)}</td></tr>`).join('')}</tbody></table></div><p class="note">If the claims were right, the last column would match the first. It does not, so Tonight suggests a stake only where the low end of the tested range is above zero.</p></details>

  return`<article class="gc s-${s==='book'?'book':''}"><div class="gm"><span>${cftime(g)} ET${g.tv?' · '+esc(g.tv):''}</span><span class="sd ${s==='live'?'early':s}">${CFST[s]}</span></div>
  <div class="teams">${row(g.a,A,g.ra,pa,'a')}${row(g.h,H,g.rh,ph,'h')}</div>
  ${pw!=null?`<div class="wb"><span class="${pk===g.a?'on':''}">${g.a} ${pc(pk===g.a?pw:1-pw)}</span><span class="wtrack"><i class="${pk===g.a?'f':''}" style="flex:${(pk===g.a?pw:1-pw).toFixed(3)}"></i><i class="${pk===g.h?'f':''}" style="flex:${(pk===g.h?pw:1-pw).toFixed(3)}"></i></span><span class="${pk===g.h?'on':''}">${pc(pk===g.h?pw:1-pw)} ${g.h}</span></div>`:''}
  <dl class="ln"><div><dt>Market</dt><dd>${g.line?esc(g.line)+(g.total?` · O/U ${g.total}`:''):'<span class="nl">No line</span>'}</dd></div><div><dt>${fin?'Result':'Model'}</dt><dd>${fin?(res||'<span class="nl">No pick made</span>'):pw!=null?`${pk} ${pc(pw)}`:'<span class="nl">Built game week</span>'}</dd></div></dl>
  <div class="ft"><span class="cfconf">${[...new Set([g.ca,g.ch].filter(Boolean))].join(' · ')||'Non-conference'}${g.neutral?' · neutral':''}</span>${g.report?`<button class="lk go" data-cg="${g.id}">Game Book</button>`:''}</div></article>`}
function cfgame(g){const A=cft(g.a),H=cft(g.h);
  return`<div class="gdbar"><a class="lk" href="#cfb-week-${g.wk}">← All Week ${g.wk} games</a><b>${g.ra?'#'+g.ra+' ':''}${esc(A.name)} ${g.neutral?'vs':'at'} ${g.rh?'#'+g.rh+' ':''}${esc(H.name)}</b>${g.report?`<a class="lk" href="${esc(g.report)}">Open as its own page ↗</a>`:''}</div>
  ${g.report?`<div class="gbhost" id="cfbhost"><p class="note">Loading the Game Book…</p></div>`:`<p class="note">No Game Book for this game.</p>`}`}

function cfbrecord(){const box=$('#v-cfb-record');if(!box.dataset.ready){box.dataset.ready=1;box.innerHTML=`<p class="note">Loading…</p>`}
  cfwrap('#v-cfb-record',()=>{const R=CF.record,n=R.weeks.reduce((s,x)=>s+x.n,0),rt=R.weeks.reduce((s,x)=>s+x.right,0),ex=R.weeks.reduce((s,x)=>s+x.exp,0);
    const hi=R.bands.filter(b=>/^[789]/.test(b.band)),hn=hi.reduce((s,b)=>s+b.n,0),hr=hi.reduce((s,b)=>s+b.right,0);
    const pl=R.players,pn=pl.reduce((s,x)=>s+(x.hi70.n||0),0),ph=pl.reduce((s,x)=>s+(x.hi70.n||0)*(x.hi70.hit||0),0);
    const MK={rec:'Receiving yards',rush:'Rushing yards',pass:'Passing yards',atd:'Anytime TD'};
    box.innerHTML=`<div class="pl-head"><h2>Track record</h2><span class="note">College football · graded each Sunday morning</span></div>
    ${n?`<div class="kpis"><div class="kpi"><small>Winner picks</small><b>${rt}-${n-rt}</b><p>${pc(rt/n)} right. The model expected ${ex.toFixed(1)} right from its own probabilities.</p></div>
    <div class="kpi"><small>Picks at 70%+</small><b>${hn?`${hr}-${hn-hr}`:'–'}</b><p>${hn?pc(hr/hn)+' right on the most confident picks.':'None graded yet.'}</p></div>
    <div class="kpi"><small>Player forecasts at 70%+</small><b>${pn?pc(ph/pn):'–'}</b><p>${pn?`Hit rate on ${pn} graded player outcomes the model rated 70% or higher.`:'None graded yet.'}</p></div></div>`:'<p class="empty">No college picks graded yet.</p>'}
    <section class="mblock"><h4>Winner picks by confidence</h4><div class="tw"><table><thead><tr><th>Model said</th><th>Games</th><th>Right</th><th>Hit rate</th><th>Expected</th></tr></thead><tbody>${R.bands.map(b=>`<tr><td>${b.band}</td><td>${b.n}</td><td>${b.right}</td><td>${pc(b.right/b.n)}</td><td>${pc(b.exp)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">A pick at 70% should be right about 7 times in 10. Small samples swing a lot, so read these as early.</p></section>
    <section class="mblock"><h4>By week</h4><div class="tw"><table><thead><tr><th>Week</th><th>Games</th><th>Right</th><th>Expected</th><th>Player 70%+ hit</th></tr></thead><tbody>${R.weeks.map(w=>{const p=pl.find(x=>x.week===w.wk);return`<tr class="click" data-rw="${w.wk}"><td>Week ${w.wk}${w.wk===9?' <small>(Top 20 only)</small>':''}</td><td>${w.n}</td><td>${w.right}</td><td>${w.exp.toFixed(1)}</td><td>${p&&p.hi70.n?`${pc(p.hi70.hit)} of ${p.hi70.n}`:'–'}</td></tr>`}).join('')}</tbody></table></div></section>
    ${pl.length?`<section class="mblock"><h4>Player forecasts</h4><div class="tw"><table><thead><tr><th>Week</th><th>Market</th><th>Forecasts</th><th>Model Brier</th><th>Base-rate Brier</th><th>Better by</th><th>Avg miss</th><th>Did not play</th></tr></thead><tbody>${pl.flatMap(x=>x.markets.map(m=>`<tr><td>Week ${x.week}</td><td>${MK[m.market]||m.market}</td><td>${m.n}</td><td>${m.brier.toFixed(4)}</td><td>${m.base.toFixed(4)}</td><td class="${m.brier<m.base?'w':'l'}">${pc(1-m.brier/m.base,1)}</td><td>${m.mae==null?'–':m.mae.toFixed(1)+' yds'}</td><td>${pc(m.absent)}</td></tr>`)).join('')}</tbody></table></div>
    <p class="note">Brier score: lower is better. Base rate is how often each yardage line hit across all players that week, so "better by" is how much the player-level forecasts beat guessing the average. "Did not play" counts forecast players with no stat line, a big risk in college with no required injury report.</p></section>`:''}`;
    document.querySelectorAll('[data-rw]').forEach(r=>r.onclick=()=>{location.hash='cfb-week-'+r.dataset.rw})})}


/* ---------- College season leaders + player matchup profile ---------- */
let CL=null,CLP=null;const CLS={pos:'WR',st:'ryd'};
const CLN={QB:'Quarterbacks',RB:'Running backs',WR:'Receivers'};
const CLL={att:'Pass attempts',cmp:'Completions',py:'Passing yards',ptd:'Passing TDs',int:'Interceptions',car:'Rush attempts',ry:'Rushing yards',rtd:'Rushing TDs',tgt:'Targets',rec:'Receptions',ryd:'Receiving yards',rctd:'Receiving TDs'};
const CLS2={att:'Att',cmp:'Cmp',py:'Pass yds',ptd:'Pass TD',int:'Int',car:'Car',ry:'Rush yds',rtd:'Rush TD',tgt:'Tgt',rec:'Rec',ryd:'Rec yds',rctd:'Rec TD'};
const CLCOL={QB:['cmp','att','py','ptd','int','ry'],RB:['car','ry','rtd','rec','ryd'],WR:['tgt','rec','ryd','rctd']};
const CLMAIN={QB:'py',RB:'ry',WR:'ryd'};
async function clload(){if(CL)return CL;CLP=CLP||fetch('cfbl.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});CL=await CLP;CL.K={};CL.keys.forEach((k,i)=>CL.K[k]=i);return CL}
const cln=t=>(CL.names[t]||[t])[0]||t,clrec=t=>(CL.names[t]||[])[1]||'',clcol=t=>(CL.names[t]||[])[2]||'#888';
const clv=(p,k)=>p[CL.K[k]];
const clbadge=(t,cls='')=>`<span class="cbadge ${cls}" style="--tc:${clcol(t)}">${esc(t)}</span>`;
function cfbleaders(pid){const box=$('#v-cfb-leaders');if(!box.dataset.ready){box.dataset.ready=1;box.innerHTML=`<p class="note">Loading season stats…</p>`}
  Promise.all([clload(),cfload().catch(()=>null)]).then(()=>pid&&CL.players[pid]?clprof(pid):cldraw()).catch(e=>{box.innerHTML=`<p class="empty">College stats did not load (${esc(e.message)}). Reload the page to try again.</p>`})}
function cldraw(){const box=$('#v-cfb-leaders'),pos=CLS.pos,sts=CL.stats[pos];if(!sts.includes(CLS.st))CLS.st=sts[0];const st=CLS.st,ids=CL.top[pos][st]||[];
  const P=ids.map(i=>[i,CL.players[i]]),mx=Math.max(1,...P.map(([,p])=>clv(p,st)));let rk=0,prev=null;
  const rows=P.map(([id,p],i)=>{const v=clv(p,st);if(v!==prev){rk=i+1;prev=v}const t=p[1];
    return`<tr class="click" data-cl="${id}" tabindex="0"><td class="lrk">${rk}</td><td><div class="lpl">${clbadge(t)}<div><span class="lnm">${esc(p[0])}</span><small>${esc(cln(t))} · ${esc(clrec(t))}</small></div></div></td><td class="mono">${p[3]}</td>
     <td class="lv"><b>${v.toLocaleString()}</b><small>${(v/p[3]).toFixed(1)}/g</small><i style="width:${Math.max(3,v/mx*100)}%;--tc:${clcol(t)}"></i></td>${CLCOL[pos].map(k=>`<td class="mono lhide">${clv(p,k).toLocaleString()}</td>`).join('')}</tr>`}).join('');
  box.innerHTML=`<div class="pl-head"><h2>Season leaders</h2><span class="note">${CL.season} FBS regular season · through week ${CL.through}</span></div>
  <div class="lgrp"><div><small>Position</small><div class="chips" role="group" aria-label="Position">${Object.keys(CLN).map(k=>`<button class="chip" data-cp="${k}" aria-pressed="${pos===k}">${CLN[k]}</button>`).join('')}</div></div>
   <div><small>Rank by</small><div class="chips" role="group" aria-label="Stat">${sts.map(k=>`<button class="chip" data-cs="${k}" aria-pressed="${st===k}">${CLL[k]}</button>`).join('')}</div></div></div>
  <div class="tw"><table class="nbt cll"><thead><tr><th>#</th><th>Player</th><th>GP</th><th class="lvh">${CLL[st]}</th>${CLCOL[pos].map(k=>`<th class="lhide">${CLS2[k]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">Top 20 by season total. Tap a player for his upcoming games and how each defense handles ${pos==='WR'?'receivers':CLN[pos].toLowerCase()}.${pos==='WR'?' College box scores don’t label tight ends, so receivers include TEs.':''} Positions are read from each player’s usage.</p>`;
  box.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{CLS.pos=b.dataset.cp;CLS.st=CL.stats[CLS.pos][0];cldraw()});
  box.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{CLS.st=b.dataset.cs;cldraw()});
  box.querySelectorAll('[data-cl]').forEach(r=>{const go=()=>location.hash='cfb-player-'+r.dataset.cl;r.onclick=go;r.onkeydown=e=>{if(e.key==='Enter')go()}})}
const clgrade=(r,N)=>r<=Math.round(N/3)?'rw':r<=Math.round(2*N/3)?'rm':'re';
function clprof(pid){const box=$('#v-cfb-leaders'),p=CL.players[pid],[n,t,pos,g]=p,N=CL.nfbs,ks=CL.dvpk[pos],dv=CL.dvp[pos]||{};
  const focus=ks.includes(CLS.st)&&CLS.pos===pos?CLS.st:CLMAIN[pos];
  const tiles=CL.stats[pos].concat(CLCOL[pos].filter(k=>!CL.stats[pos].includes(k))).slice(0,6).map(k=>{const v=clv(p,k),r=(CL.top[pos][k]||[]).indexOf(pid);
    return`<div class="ctile"><small>${CLL[k]}</small><b>${v.toLocaleString()}</b><span>${(v/g).toFixed(1)} per game</span>${r>=0?` <em>#${r+1} FBS</em>`:''}</div>`}).join('');
  const sched=CL.sched[t]||[];
  const gb=(o,wk)=>CF&&CF.games.find(x=>x.wk===wk&&((x.a===t&&x.h===o)||(x.h===t&&x.a===o)));
  const cards=sched.map(([wk,kick,o,ha])=>{const D=dv[o],d=new Date(kick),day=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/New_York'}),tm=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'});
    const G=gb(o,wk),head=`<h4>${clbadge(o)}${ha===1?'vs':ha===2?'vs':'@'} ${esc(cln(o))} <small>${esc(clrec(o))}${ha===2?' · neutral':''}</small></h4><small class="note">Week ${wk} · ${day}, ${tm} ET${G&&G.line?` · ${esc(G.line)}`:''}</small>`;
    if(!D)return`<div class="cup">${head}<p class="note">${esc(o)} isn’t an FBS team, so there’s no defense data to compare.</p></div>`;
    const r=D[focus][1],c=clgrade(r,N);
    return`<div class="cup">${head}<div class="mxban ${c}"><b>${c==='rw'?'Favorable':c==='rm'?'Neutral':'Tough'} matchup</b><span>${esc(o)} allows ${D[focus][0]} ${CLL[focus].toLowerCase()} per game to ${CLN[pos].toLowerCase()} — #${r} of ${N}${r<=20?' (one of the most generous)':r>N-20?' (one of the stingiest)':''}</span></div>
     <table><thead><tr><th>Allowed to ${CLN[pos].toLowerCase()}</th><th>Per game</th><th>FBS rank</th></tr></thead><tbody>${ks.map(k=>`<tr class="${k===focus?'hit':''}"><td>${CLL[k]}</td><td class="mono">${D[k][0]}</td><td><span class="rk ${clgrade(D[k][1],N)}">#${D[k][1]}</span></td></tr>`).join('')}</tbody></table>
     ${G&&G.report?`<a class="lk" href="#cfb-game-${G.id}">Open the Game Book →</a>`:''}</div>`}).join('');
  const L=(CL.log[pid]||[]).slice().reverse(),lc=CLCOL[pos];
  const log=`<div class="tw"><table class="nbt cll"><thead><tr><th>Wk</th><th>Opp</th><th>Result</th>${lc.map(k=>`<th>${CLS2[k]}</th>`).join('')}</tr></thead><tbody>${L.map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[2]===1?'vs':r[2]===2?'vs':'@'} ${esc(r[1])}</td><td class="mono">${esc(r[3])}</td>${lc.map(k=>`<td class="mono">${r[4+CL.keys.indexOf(k)-4]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  box.innerHTML=`<p><a class="lk" href="#cfb-leaders">← Season leaders</a></p><div class="cpp">
   <div class="cph">${clbadge(t)}<div><h2>${esc(n)}</h2><p>${esc(cln(t))} · ${pos==='WR'?'Receiver':pos==='RB'?'Running back':'Quarterback'} · ${esc(clrec(t))} · ${g} games</p></div></div>
   <div class="ctiles">${tiles}</div>
   <section><h3 class="sec">Upcoming games</h3>${cards?`<div class="cupg">${cards}</div>`:'<p class="note">No regular-season games left on the schedule.</p>'}
   <p class="note">What each defense has allowed per game to all ${CLN[pos].toLowerCase()} combined in ${CL.season}. Rank 1 = gives up the most (best for ${esc(n.split(' ').slice(-1)[0])}), ${N} = gives up the least; for interceptions, 1 = forces the fewest. Green is the top third for him, yellow the middle, red the bottom third. Raw totals, not adjusted for the offenses each defense faced.</p></section>
   <section><h3 class="sec">2026 game log</h3>${log}</section></div>`;
  scrollTo(0,0)}
function cfbteampos(){const box=$('#v-cfb-teampos');if(!box.dataset.ready){box.dataset.ready=1;box.innerHTML=`<div class="pl-head"><h2>Team vs position</h2><span class="note" id="ctpnote">Loading…</span></div><div id="ctpbody"></div>`}
  cfwrap('#ctpbody',ctpdraw)}
const CTPN={QB:'Quarterbacks',RB:'Running backs',WR:'Receivers (WR + TE)'};
const ctpfp=r=>.04*r.py+CS.ptd*r.ptd-2*r.int+.1*(r.ry+r.ryd)+6*(r.rtd+r.rctd)+({std:0,half:.5,ppr:1}[CS.type])*r.rec;
function ctpdraw(){const tf=CF.teampos.find(x=>x.key===CS.tf),all=tf.pos[CS.pos];
  const fp=new Map(all.map(r=>[r.team,ctpfp(r)])),order=all.slice().sort((a,b)=>fp.get(a.team)-fp.get(b.team)),rk=new Map(order.map((r,i)=>[r.team,i+1])),N=all.length;
  const rows=all.filter(r=>CS.conf==='all'||(CS.conf==='top25'?cft(r.team).rank:cft(r.team).conf===CS.conf));
  const val=(r,k)=>k==='rk'?fp.get(r.team):k==='fp'?fp.get(r.team):k==='team'?(cft(r.team).short||r.team):k==='ypc'?(r.car?r.ry/r.car:0):r[k];
  rows.sort((a,b)=>{const x=val(a,CS.sort),y=val(b,CS.sort),c=typeof x==='string'?x.localeCompare(y):(x??-1)-(y??-1);return CS.asc?c:-c});
  const G2={QB:['pass','rush'],RB:['rush','recv'],WR:['recv','rush']}[CS.pos];
  const COL={pass:[['att','Att'],['cmp','Cmp'],['py','Yd'],['ptd','TD'],['int','Int'],['rate','Rate']],rush:[['car','Att'],['ry','Yd'],['ypc','Avg'],['rtd','TD']],recv:[['tgt','Tgt'],['rec','Rec'],['ryd','Yd'],['rctd','TD']]};
  const cols=G2.flatMap((g,gi)=>COL[g].filter(c=>!(c[0]==='rate'&&CS.pos!=='QB')).map((c,ci)=>[...c,gi>0&&ci===0]));
  const th=(k,l,c='')=>`<th class="s ${c} ${CS.sort===k?'on'+(CS.asc?' asc':''):''}" data-k="${k}">${l}</th>`;
  const sel=(id,l,o,v)=>`<label>${l}<select id="${id}">${o.map(([a,b])=>`<option value="${a}"${String(a)===String(v)?' selected':''}>${b}</option>`).join('')}</select></label>`;
  const f2=(v,k)=>v==null?'–':k==='rate'?v.toFixed(1):v.toFixed(2);
  const mx=Math.max(...fp.values()),mn=Math.min(...fp.values());
  const nxt=new Map(CF.games.filter(g=>g.wk===CF.week&&!g.done).flatMap(g=>[[g.a,g.h],[g.h,g.a]]));
  $('#ctpnote').textContent=`Per-game averages each defense has allowed · ${CF.season} regular season through Week ${tf.through}`;
  $('#ctpbody').innerHTML=`<div class="tpbar ctl">${sel('ctpp','Position',Object.entries(CTPN),CS.pos)}${sel('ctpc','Teams',[['all','All in scope'],['top25','AP Top 25'],['SEC','SEC'],['ACC','ACC'],['Big Ten','Big Ten'],['Big 12','Big 12']],CS.conf)}${sel('ctpt','Timeframe',CF.teampos.map(t=>[t.key,t.label]),CS.tf)}${sel('ctpy','Type',[['std','Standard'],['half','Half PPR'],['ppr','PPR']],CS.type)}${sel('ctpd','Pass TD',[[4,'4 points'],[6,'6 points']],CS.ptd)}</div>
  <div class="tpt"><div class="cap">${CTPN[CS.pos]} · ${esc(tf.label)}<small>${rows.length} defenses shown · rank ${N} of ${N} allows the most fantasy points</small></div><div class="tw"><table>
  <thead><tr class="grp"><th colspan="2"></th>${G2.map(g=>`<th colspan="${COL[g].filter(c=>!(c[0]==='rate'&&CS.pos!=='QB')).length}">${{pass:'Passing',rush:'Rushing',recv:'Receiving'}[g]}</th>`).join('')}<th colspan="1"></th></tr>
  <tr>${th('rk','Rank')}${th('team','Team','tm')}${cols.map(([k,l,b])=>th(k,l,b?'bl':'')).join('')}${th('fp','Fpts','bl')}</tr></thead>
  <tbody>${rows.map(r=>{const n=rk.get(r.team),T=cft(r.team);return`<tr class="${n>N-10?'soft':n<=10?'tough':''}"><td class="rk">${n}</td><td class="tn">${T.rank?`<small class="cfrk">${T.rank}</small>`:''}${esc(T.short||r.team)}${nxt.has(r.team)?`<span class="opp" title="Plays ${esc(cft(nxt.get(r.team)).name)} in Week ${CF.week}">vs ${nxt.get(r.team)}</span>`:''}</td>
  ${cols.map(([k,,b])=>`<td class="${b?'bl':''}">${f2(val(r,k),k)}</td>`).join('')}<td class="fp bl">${fp.get(r.team).toFixed(2)}<i><b style="width:${((fp.get(r.team)-mn)/(mx-mn||1)*100).toFixed(0)}%"></b></i></td></tr>`}).join('')}</tbody></table></div></div>
  <p class="note">Ranks run across all ${N} teams in scope (SEC, ACC, Big Ten, Big 12 and the AP Top 25), 1 = allows the fewest fantasy points. Every opposing player at the position is added up for each game, including games against FCS teams, then averaged over games played. College box scores carry no positions, so roles come from usage: tight ends count as receivers, and a quarterback is whoever threw. Passer rating is the NCAA formula from season totals. Green allows the most, red the fewest. Click a column to sort. This is context, not a model input.</p>`;
  const on=(id,f)=>$('#'+id).onchange=e=>{f(e.target.value);ctpdraw()};
  on('ctpp',v=>CS.pos=v);on('ctpc',v=>CS.conf=v);on('ctpt',v=>CS.tf=v);on('ctpy',v=>CS.type=v);on('ctpd',v=>CS.ptd=+v);
  document.querySelectorAll('#ctpbody th.s').forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(CS.sort===k)CS.asc=!CS.asc;else{CS.sort=k;CS.asc=k==='team'||k==='rk'}ctpdraw()})}

route();

</script>
