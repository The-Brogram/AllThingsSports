<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><base href="../"><title>NHL predictions today · AllThingsSports</title><meta name="description" content="Who wins every NHL game today, how it splits between regulation, overtime and a shootout, and goalie news."><link rel="canonical" href="https://the-brogram.github.io/AllThingsSports/nhl/"><meta property="og:title" content="NHL predictions today · AllThingsSports"><meta property="og:description" content="Who wins every NHL game today, how it splits between regulation, overtime and a shootout, and goalie news."><meta property="og:url" content="https://the-brogram.github.io/AllThingsSports/nhl/"><meta property="og:type" content="website"><meta property="og:image" content="https://the-brogram.github.io/AllThingsSports/brand/icon-512.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style><script>window.HUBSTART="nhl"</script></head><body>
<meta name="claude:viewport-fit-sides" content="cover"><link rel="icon" type="image/png" sizes="32x32" href="brand/icon-32.png"><link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap">
<style>
/* Dark, minimal, one neutral interface. Green and red carry meaning only: green = the side the model favors, likely, won, up;
   red = the other side, lost, down. Buttons, tabs and the current page use white and greys. Deliberately dark in every theme (dark only). */
:root{
  --bg:#0a0d0f;--pan:#111518;--pan2:#1a2024;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);
  --fg:#e9edf0;--mut:#9aa4ac;--dim:#6f7881;--hi:#ffffff;
  --grn:#2fd27a;--grn-d:rgba(47,210,122,.13);--pa:#6b8cff;--pb:#e0a043;--red:#f25c5f;--red-d:rgba(242,92,95,.14);
  --disp:'Geist',system-ui,-apple-system,sans-serif;--body:'Geist',system-ui,-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --r:12px;--gut:max(16px,env(safe-area-inset-left,0px));--gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14.5px/1.55 var(--body);margin:0;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--grn)}
button,select{font-family:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

/* header */
.top{position:relative;overflow:hidden;padding-block:34px 26px;padding-left:var(--gut);padding-right:var(--gutr);border-bottom:1px solid var(--line)}
.top::before{content:"";position:absolute;inset:-40% -10% auto auto;width:60%;height:200%;background:radial-gradient(closest-side,rgba(47,210,122,.10),transparent 70%);pointer-events:none}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--grn),transparent 45%,transparent 55%,var(--red))}
.wrap{max-width:1240px;margin:0 auto;position:relative}
.eyebrow{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--fg);background:var(--red-d);border:1px solid rgba(242,92,95,.35);padding:3px 10px;border-radius:999px;letter-spacing:.08em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(242,92,95,.6)}
@media (prefers-reduced-motion:no-preference){.live i{animation:pulse 2s infinite}@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(242,92,95,0)}100%{box-shadow:0 0 0 0 rgba(242,92,95,0)}}html{scroll-behavior:smooth}}
.top h1{font:600 clamp(40px,8vw,84px)/.92 var(--disp);letter-spacing:-.01em;margin:14px 0 12px;text-wrap:balance}
.top h1 span{color:var(--grn)}
.top p{margin:0;color:var(--mut);max-width:70ch;font-size:15px}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,13,15,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut);padding-right:var(--gutr)}
.seg{max-width:1240px;margin:0 auto;display:flex}
.seg div{display:inline-flex;gap:2px;background:var(--pan);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;max-width:100%}
nav button{font:600 14px var(--body);border:0;background:transparent;color:var(--mut);padding:7px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
nav button:hover{color:var(--fg)}
nav button[aria-pressed=true]{background:var(--fg);color:var(--bg)}

main{max-width:1240px;margin:0 auto;padding-block:22px 72px;padding-left:var(--gut);padding-right:var(--gutr)}
h2{font:600 clamp(30px,5vw,44px)/1 var(--disp);letter-spacing:-.01em;margin:0;text-wrap:balance}
.note{color:var(--mut);font-size:13.5px;max-width:90ch}

/* week rail */
.wstrip{display:flex;gap:6px;overflow-x:auto;padding-block:2px 14px;margin-bottom:14px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.wstrip button{flex:0 0 auto;display:grid;gap:2px;text-align:center;min-width:58px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--pan);color:var(--fg);cursor:pointer;font:700 15px var(--disp);transition:border-color .15s,background .15s}
.wstrip button small{font:500 10.5px var(--mono);color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.wstrip button:hover{border-color:var(--line2)}
.wstrip button.done{color:var(--mut)}
.wstrip button.cur{border-color:rgba(242,92,95,.55)}.wstrip button.cur small{color:var(--red)}
.wstrip button[aria-pressed=true]{background:var(--grn);border-color:var(--grn);color:var(--bg)}.wstrip button[aria-pressed=true] small{color:var(--bg);opacity:.75}

.whead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:10px}
.whead .note{font-family:var(--mono);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-block:6px 4px}
.legend>span{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);background:var(--pan);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px}

/* status pills */
.st{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.st.final{background:var(--pan2);color:var(--mut);border-color:var(--line2)}
.st.book{background:var(--grn);color:var(--bg)}
.st.lines{color:var(--grn);border-color:rgba(47,210,122,.45);background:var(--grn-d)}
.st.early{color:var(--red);border-color:rgba(242,92,95,.45);background:var(--red-d)}

.day{font:700 13px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--mut);margin:30px 0 12px;display:flex;align-items:center;gap:12px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}

/* game cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px}
.gc{background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0;transition:border-color .2s,transform .2s}
.gc:hover{border-color:var(--line2)}
.gc.sel{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn),0 10px 40px -12px rgba(47,210,122,.35)}
.gc .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--mut);min-width:0}
.gc .meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm2{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.tm2 b{font:600 28px/1 var(--disp);letter-spacing:-.01em;}
.tm2 .nm{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm2 .pt{font:700 24px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.tm2 .pt.fin{font-size:28px}.tm2 .fav{color:var(--grn)}
.tm2 .lose{opacity:.4}
.wbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--mut)}
.wbar .on{color:var(--grn)}
.wp{display:flex;gap:3px;height:6px}
.wp span{display:block;height:100%;border-radius:3px;min-width:3px}
.wp .f{background:var(--grn)}.wp .u{background:var(--red);opacity:.55}
.lns{display:grid;grid-template-columns:1fr 1fr;gap:10px;font:500 12.5px var(--mono);font-variant-numeric:tabular-nums}
.lns>span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.lns small{display:block;font:600 10px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}
.likely{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.likely .h{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.likely li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.likely li:not(.h) span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.likely li:not(.h) span:last-child{font:700 12px var(--mono);color:var(--grn);background:var(--grn-d);padding:2px 8px;border-radius:999px}
.res{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--mut)}
.tag{font:700 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px}
.tag.good{color:var(--grn);background:var(--grn-d)}.tag.bad{color:var(--red);background:var(--red-d)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 13px var(--body);border:1px solid var(--line2);background:transparent;color:var(--fg);padding:7px 14px;border-radius:999px;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--mut)}
.btn.fill{background:var(--grn);border-color:var(--grn);color:var(--bg)}.btn.fill:hover{filter:brightness(1.08)}
.btn[aria-expanded=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.sbs{margin-top:14px;scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}

/* side by side */
.mhead{display:grid;grid-template-columns:1fr minmax(0,1.5fr) 1fr;gap:14px;align-items:center;background:radial-gradient(120% 140% at 0% 0%,rgba(47,210,122,.10),transparent 55%),radial-gradient(120% 140% at 100% 100%,rgba(242,92,95,.10),transparent 55%),var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:14px}
.mhead .tm b{display:block;font:600 clamp(34px,6vw,58px)/1 var(--disp);}
.mhead .tm span{font:500 12.5px var(--mono);color:var(--mut)}
.mhead .r{text-align:right}
.mhead .mid{display:grid;gap:8px;text-align:center}
.mhead .pts{display:flex;justify-content:center;align-items:baseline;gap:14px}
.mhead .pts b{font:700 38px/1 var(--mono);font-variant-numeric:tabular-nums}
.mhead small{color:var(--mut);font-size:12.5px}
.mblock{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-block:12px}
.mblock h4{font:600 17px var(--disp);letter-spacing:-.01em;margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kind{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;padding:3px 9px;border-radius:999px}
.kind.pred{background:var(--grn-d);color:var(--grn)}.kind.ctx{border:1px solid var(--line2);color:var(--mut)}
.mrow{display:grid;grid-template-columns:1fr minmax(120px,200px) 1fr;gap:8px 18px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-of-type{border-bottom:0}
.mrow .lab{text-align:center;font-size:13px;color:var(--mut)}
.mrow .l,.mrow .r{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}.mrow .l{grid-template-columns:1fr auto}
.mrow .l .v{order:2;text-align:right}.mrow .l .bar{order:1;direction:rtl}
.mrow .v{font:600 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}.mrow .v i{font-style:normal;font-weight:400;color:var(--dim);font-size:11px;margin-left:5px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:block}
.bar span{display:block;height:100%;border-radius:3px;background:var(--red);opacity:.55}
.mrow .win .bar span{background:var(--grn);opacity:1}.mrow .win .v{color:var(--grn)}

.mrow .lab small{display:block;font-size:11px;color:var(--dim)}
.mcols{display:grid;grid-template-columns:1fr minmax(120px,200px) 1fr;gap:8px 18px;align-items:end;padding:2px 0 10px;border-bottom:1px solid var(--line2);margin-bottom:2px}
.mcols b{display:block;font:600 15px var(--disp);letter-spacing:-.01em;}.mcols small{display:block;font:500 11.5px var(--mono);color:var(--mut)}
.mcols .l{text-align:right}.mcols .lab{text-align:center;font:500 10.5px/1.45 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.05em}

/* compare + record */
.cmp{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;margin-block:14px}
.cmp label{display:grid;gap:5px;font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
select{font:600 15px var(--body);padding:9px 12px;border:1px solid var(--line2);background:var(--pan);color:var(--fg);border-radius:10px;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-block:16px}
.kpi{background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi small{display:block;font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.kpi b{display:block;font:600 44px/1.1 var(--disp);font-variant-numeric:tabular-nums;margin-top:6px;color:var(--grn)}
.kpi p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font:13px/1.4 var(--mono);font-variant-numeric:tabular-nums}
th{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);text-align:right;padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:hover td{background:var(--pan2)}
.hb{display:block;height:6px;border-radius:3px;background:var(--grn);margin-block:2px}.hb.p{background:var(--mut);opacity:.4}
.empty{color:var(--mut);background:var(--pan);border:1px dashed var(--line2);border-radius:var(--r);padding:16px 18px}

@media (max-width:640px){
  .mrow{grid-template-columns:1fr 1fr;grid-template-areas:"lab lab" "l r";row-gap:4px}.mcols{grid-template-columns:1fr 1fr}.mcols .lab{grid-column:1/-1;grid-row:1}.mrow .lab{grid-area:lab}.mrow .l{grid-area:l}.mrow .r{grid-area:r}
  .mhead{grid-template-columns:1fr 1fr;padding:16px}.mhead .mid{grid-column:1/-1;grid-row:2}
  .top{padding-block:26px 20px}
}

/* sidebar: sport first, then its pages. On narrow screens it slides in from the left. */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.content{min-width:0}
#side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--pan);border-right:1px solid var(--line);padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:22px}
.brand{font:600 20px/1 var(--disp);letter-spacing:-.01em;padding-inline:8px;display:flex;gap:0}.brand b{color:var(--grn)}
.sport{display:grid;gap:2px}.spl{display:grid;gap:2px}
.sport>summary{list-style:none;cursor:pointer;border-radius:10px;user-select:none}.sport>summary::-webkit-details-marker{display:none}
.sport>summary:hover{background:var(--pan2)}
.sh .chev{width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin:-3px 4px 0 2px;transition:transform .15s}
.sport:not([open])>summary .chev{transform:rotate(-45deg);margin-top:0}
.sh{display:flex;align-items:center;gap:8px;font:600 15px var(--disp);letter-spacing:-.01em;padding:6px 8px 10px}
.sh i{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 3px var(--grn-d)}.sh small{margin-left:auto;font:500 10.5px var(--mono);color:var(--dim);text-transform:none;letter-spacing:0}
#side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:600 14px var(--body);color:var(--mut);background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer;position:relative}
#side button .ic{width:18px;text-align:center;color:var(--dim);font-size:13px}
#side button:hover{color:var(--fg);background:var(--pan2)}
#side button[aria-pressed=true]{color:var(--fg);background:var(--pan2)}#side button[aria-pressed=true] .ic{color:var(--grn)}
#side button[aria-pressed=true]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--grn)}
.soon{margin-top:auto;border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;display:grid;gap:2px}.soon b{font:700 13px var(--body);color:var(--mut)}.soon small{font-size:12px;color:var(--dim)}
.mbar{display:none}.scrim{display:none}
@media (max-width:959px){
  .shell{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:min(84vw,290px);z-index:40;transform:translateX(-105%);box-shadow:20px 0 60px rgba(0,0,0,0.60)}
  body.mm #side{transition:transform .22s ease}
  body.menu #side{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,0.60)}
  .mbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,13,15,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut);padding-right:var(--gutr)}
  .mbar button{font:600 14px var(--body);color:var(--fg);background:var(--pan);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;cursor:pointer}
  .mbar span{font:600 12px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

/* player lookup */
.pl-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:6px}
.search{position:relative;max-width:620px;margin-block:14px 10px}
.search input{width:100%;font:500 17px var(--body);color:var(--fg);background:var(--pan);border:1px solid var(--line2);border-radius:14px;padding:13px 16px 13px 44px;outline:none}
.search input:focus{border-color:var(--grn);box-shadow:0 0 0 3px var(--grn-d)}
.search::before{content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-52%);font-size:22px;color:var(--dim)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;background:var(--pan2);border:1px solid var(--line2);border-radius:14px;padding:6px;list-style:none;margin:0;box-shadow:0 20px 50px -10px rgba(0,0,0,0.60);max-height:380px;overflow-y:auto}
.sres li button{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:8px 10px;border-radius:10px;cursor:pointer;font:500 14.5px var(--body)}
.sres li button:hover,.sres li button.on{background:var(--pan)}
.pos{display:inline-grid;place-items:center;font:700 11px var(--mono);border-radius:7px;padding:3px 0;min-width:36px;background:var(--bg);border:1px solid var(--line2);color:var(--mut)}
.pos.QB{color:#e3b341;border-color:rgba(168,111,10,.4)}.pos.RB{color:var(--grn);border-color:rgba(47,210,122,.4)}.pos.WR{color:#5aa9ef;border-color:rgba(26,115,201,.4)}.pos.TE{color:var(--red);border-color:rgba(194,46,71,.4)}

function about(){$('#v-about').innerHTML=`<div class="ab"><div class="eyebrow"><span>About</span></div><h2>How AllThingsSports works</h2>
 <p class="lead">AllThingsSports turns each game into a chance: how likely a team is to win, or a bet is to hit. That chance always comes first. Where a sportsbook price exists we show it beside our chance, so you can see both, and we grade every pick after the game.</p>
 <div class="abg">
  <div><h3>NFL and college football</h3><p>Every game is simulated thousands of times from opponent-adjusted team ratings and player history. Each game gets a Game Book: win chances, projected score, player lines and the matchups behind them.</p><a href="#record">NFL track record</a> · <a href="#cfb-record">College track record</a></div>
  <div><h3>NBA</h3><p>Each game is simulated 10,000 times from team and player data, giving win chances, a margin range and every player line, next to DraftKings' prices where they exist.</p><a href="#nba-record">NBA track record</a></div>
  <div><h3>NHL</h3><p>Who wins starts from the market's no-vig price, because nothing we tested beat it. The model adds how a game splits: regulation, overtime or a shootout, plus goalie news.</p><a href="#nhl-record">NHL track record</a></div>
  <div><h3>Champions League</h3><p>Expected goals for both sides give the chances of each result, the total and both teams scoring, with scouting notes for each matchday.</p><a href="#ucl-record">Champions League track record</a></div>
 </div>
 <h3>Rules we keep</h3>
 <ul class="abl"><li><b>Likelihood first.</b> A pick's chance of hitting is shown before any edge, never replaced by one.</li>
 <li><b>Graded in public.</b> Every posted pick is graded after the game at the price it was posted, wins and losses alike.</li>
 <li><b>No edge until it is proven.</b> An edge only counts once it has beaten real prices on games the model had not seen. Until then we call it a lead.</li>
 <li><b>Nothing is guaranteed.</b> A 90% chance still loses one time in ten.</li></ul>
 <p class="note">AllThingsSports is for information. Nothing on this site places a bet; the bet tracker and Cash Center only record bets you place yourself.</p></div>`}

/* ===================== NHL: nhl.json (ESPN scoreboard, DraftKings lines, probable goalies, standings, leaders, built by nhl/hub_nhl.py)

   never a made-up number. All NHL code lives in this one block; the router calls NHL.route(hash). ===================== */
const NHL=(()=>{

const dlong=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});

const today=()=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}};
const T=ab=>(N.teams||{})[ab]||{name:ab||'?',nick:ab||'?',loc:''};

let ALLG=[],G={},DAYOF={},ST={};

/* standings index: division rank, conference rank, playoff zone (top 3 per division = z1, two wild cards = z2) */
function index(){ALLG=Object.values(DAYS()).flat();G={};DAYOF={};ST={};

    const cmp=(a,b)=>b.pts-a.pts||a.gp-b.gp||b.rw-a.rw;all.sort(cmp);all.forEach((x,i)=>x.cr=i+1);

    const wc2=rest[1];rest.forEach(x=>x.back=x.wc>2&&wc2?wc2.pts-x.pts:null);C.wc=rest;C.all=all})}
function load(box,fn){if(N)return fn();if(!box.innerHTML||box.querySelector('.empty'))box.innerHTML='<p class="note">Loading…</p>';
  NP=NP||fetch('nhl.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});

    const b=box.querySelector('[data-nretry]');if(b)b.onclick=()=>route(location.hash.slice(1))})}
const tinfo=ab=>{const s=ST[ab];return s?`${s.w}-${s.l}-${s.otl} · ${s.pts} pts · ${ord(s.dr)} ${s.div}`:''};

/* ---------- shared bits ---------- */
function head(eb,title,sub){return`<div class="cfhead"><div><div class="eyebrow"><span>NHL · ${esc(N.season||'2026-27')}${eb?' · '+eb:''}</span>${N.built?`<span class="upd">Updated ${esc(N.built)}</span>`:''}</div>${title?`<h2>${title}</h2>`:''}${sub?`<p class="note">${sub}</p>`:''}</div></div>`}
const gstat=s=>s==='Confirmed'?'c':s==='Expected'?'e':'u';
const dis=g=>g&&g.agree===false?`<i class="nhgs dis" title="ESPN and DailyFaceoff name different starters">Sources disagree</i>`:'';
const goalie=t=>t&&t.g&&t.g.n?`<span class="nhg"><span class="gi">G</span><span>${esc(t.g.n)}</span><i class="nhgs ${gstat(t.g.st)}">${esc(t.g.st||'Unconfirmed')}</i>${dis(t.g)}</span>`:`<span class="nhg"><span class="gi">G</span>Starter not reported <i class="nhgs u">Unconfirmed</i></span>`;
const pend=(t='Model output — pending')=>`<span class="nhpend">${t}</span>`;
function urow(label,sub,lv,rv,better,fmt=v=>v,scale){const ok=lv!=null&&rv!=null&&!isNaN(lv)&&!isNaN(rv),mx=scale??(Math.max(Math.abs(+lv||0),Math.abs(+rv||0))*1.1||1);let lw='',rw='';
  if(ok&&better&&+lv!==+rv){const lb=better==='hi'?+lv>+rv:+lv<+rv;lw=lb?'w':'';rw=lb?'':'w'}
  const bar=v=>v==null||isNaN(v)?'':`<span class="f" style="width:${Math.min(100,Math.abs(+v)/mx*100)}%"></span>`;
  return`<div class="urow"><div class="us h ${lw}"><span class="v">${lv==null||isNaN(lv)?'n/a':fmt(lv)}</span><span class="k">${bar(lv)}</span></div><div class="l">${label}${sub?`<em>${sub}</em>`:''}</div><div class="us a ${rw}"><span class="v">${rv==null||isNaN(rv)?'n/a':fmt(rv)}</span><span class="k">${bar(rv)}</span></div></div>`}
const utrow=(l,a,b)=>`<div class="urow"><div class="us h"><span class="x">${a}</span></div><div class="l">${l}</div><div class="us a"><span class="x">${b}</span></div></div>`,ug=t=>`<div class="g">${t}</div>`;
const ot=g=>/OT|SO/.exec(g.det||'')?.[0];
const prevDay=d=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()-1);return x.toISOString().slice(0,10)};
/* winner side of a finished game: res first, then the score */
const wside=g=>g.res?(g.res.a==='W'?'a':g.res.h==='W'?'h':null):(+g.a?.score>+g.h?.score?'a':+g.h?.score>+g.a?.score?'h':null);
const otlSide=(g,s)=>g.res?g.res[s]==='OTL':(wside(g)&&wside(g)!==s&&!!ot(g));
/* back-to-back: the file's b2b flag; if absent, whether the team played the previous day (only when that day is on file). A tracked lead, never a probability change */
const b2b=(g,s)=>{if(g.b2b&&g.b2b[s]!=null)return!!g.b2b[s];const p=DAYS()[prevDay(DAYOF[g.id])],ab=g[s]?.ab;return!!p&&p.some(x=>x.a?.ab===ab||x.h?.ab===ab)};
const b2bTag=(g,s)=>b2b(g,s)?`<span class="nhb2b" title="Second night of a back-to-back. A tracked lead, not proven: it does not change any chance shown.">2nd of back-to-back · tracked lead, not in the chances</span>`:'';
const hasM=g=>!!(g.m&&g.m.ph!=null&&g.m.pa!=null);

/* ---------- one game row (away left, home right); the bar is always the market's two-way chance ---------- */
function row(g){const A=g.a||{},H=g.h||{},m=g.mk,fin=g.st==='post',live=g.st==='in',w=fin?wside(g):null,x=ot(g);
  const res=s=>!fin||!w?'':w===s?'rw':'rl',tag=s=>!fin||!w?'':`<i class="urt ${res(s)}">${w===s?'W':'L'}</i>${otlSide(g,s)?`<i class="nhotl" title="Lost in ${x||'OT'}: still earns a standings point">OTL</i>`:''}`;
  const tm=(t,s)=>`<div class="ut ${s==='a'?'l':'r'} ${res(s)}"><b>${s==='h'?tag(s):slg('nhl',t.ab,'lgl')}${esc(T(t.ab).nick)}${s==='a'?tag(s):slg('nhl',t.ab,'lgr')}</b><small>${esc(t.ab)}${tinfo(t.ab)?' · '+esc(tinfo(t.ab)):''}</small>${goalie(t)}</div>`;
  const ok=m&&m.a!=null&&m.h!=null,af=ok&&m.a>m.h;
  const bar=ok?`<div class="ubar" role="img" aria-label="Market: ${esc(T(A.ab).name)} ${pc(m.a)}, ${esc(T(H.ab).name)} ${pc(m.h)}"><i class="${af?'g':'r'}" style="width:${m.a*100}%"></i><i class="${af?'r':'g'}" style="width:${m.h*100}%"></i></div>
    <div class="ulab"><span class="${af?'g':'r'}">${esc(A.ab)} ${pc(m.a)}</span><span class="y" style="color:var(--mut)">${fin||live?'pre-game market':'market · incl. OT/SO'}</span><span class="${af?'r':'g'}">${pc(m.h)} ${esc(H.ab)}</span></div>`:'';
  const o=g.odds,fav=ok?(m.a>m.h?'a':'h'):null;
  const center=fin||live?`<b>${esc(A.score??'')}<span>–</span>${esc(H.score??'')}</b><small>${live?`<span class="nhlive"><i></i>${esc(g.det)}</span>`:esc(g.det)}${A.sog?` · shots ${esc(A.sog)}–${esc(H.sog)}`:''}</small>`:`<b class="t">${g.t?et(g.t):'TBD'}</b><small>ET${g.venue?' · '+esc(g.venue):''}</small>`;
  const ux=[];
  if(!ok&&!fin)ux.push(g.st==='in'?'<span>No DraftKings line was saved before puck drop</span>':'<span>Lines not posted yet · DraftKings posts about a day before puck drop</span>');
  if(o&&ok&&!fin&&!live){const pl=o.pl&&o.pl[fav==='a'?0:1];if(pl)ux.push(`<span>Puck line <b>${esc(String(pl[0]).replace('-','−'))} ${esc(fav==='a'?A.ab:H.ab)}</b></span>`);if(o.tot&&o.tot[0]!=null)ux.push(`<span>Total <b>${esc(o.tot[0])}</b></span>`)}
  if(fin&&ok&&w){ux.push(`<span>Market favorite ${w===fav?'<b class="hit">won</b>':'<b class="miss">lost</b>'}${x?` (${x})`:''}</span>`)}
  if(hasM(g)){const M=g.m,ms=M.pa>M.ph?'a':'h',e=M.ml?.[ms==='a'?'edge_a':'edge_h'];ux.push(`<span class="nhmod">Model <b>${esc(g[ms].ab)} ${pc(ms==='a'?M.pa:M.ph)}</b>${e!=null?` <em>· edge ${pts(e)}</em>`:''}</span>`)}
  else if(!fin)ux.push(pend('Model — pending'));
  return`<a class="nhr" href="#nhl-game-${esc(g.id)}">${tm(A,'a')}<div class="uc"><div class="ucs1">${center}</div>${bar}<div class="ux">${ux.join('')}</div></div>${tm(H,'h')}</a>`}

/* ---------- Games view: date rail + rows ---------- */
let NSORT='time';
function nhday(day){const box=$('#v-nhl'),D=DAYS(),days=Object.keys(D).sort(),TD=today();
  if(!days.length){box.innerHTML=head('','Games','')+'<p class="empty">No NHL games are on file right now.</p>';return}
  let jumped=false;
  if(!day||!D[day]){const has=d=>d&&D[d]&&D[d].length;if(has(TD))day=TD;else{day=has(N.next)?N.next:(days.find(d=>d>=TD&&has(d))||[...days].reverse().find(has)||days[days.length-1]);jumped=day!==TD}}
  const L=[...(D[day]||[])],i=days.indexOf(day),done=L.filter(g=>g.st==='post').length;
  const rail=`<div class="wstrip nhrail" role="group" aria-label="Day">${days.map(d=>{const n=D[d]||[],dt=new Date(d+'T12:00:00');return`<button data-day="${d}" class="${n.length?'':'none'} ${d===TD?'today':''}" aria-pressed="${d===day}"><small>${d===TD?'Today':dt.toLocaleDateString('en-US',{weekday:'short'})}</small><b>${dshort(d)}</b><small>${n.length?n.length+' game'+(n.length>1?'s':''):'No games'}</small></button>`}).join('')}</div>`;
  const first=L.length?et(L.map(g=>g.t).filter(Boolean).sort()[0]):'';
  let sub=L.length?`${L.length} game${L.length>1?'s':''}${done===L.length?' · all final':first?` · first puck drop ${first} ${TZL}`:''}`:'No NHL games are scheduled this day.';
  if(done){const mk=L.filter(g=>g.mk&&g.mk.a!=null&&g.st==='post'&&wside(g)),hit=mk.filter(g=>(g.mk.a>g.mk.h?'a':'h')===wside(g)).length;if(mk.length)sub+=` · market favorites won ${hit} of ${mk.length}`}
  if(NSORT==='fav')L.sort((a,b)=>Math.max(b.mk?.a||0,b.mk?.h||0)-Math.max(a.mk?.a||0,a.mk?.h||0));else L.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
  const jmp=jumped?`<p class="nhjump" role="status">No NHL games today (${esc(dlong(TD))}). Showing the next slate: <b>${esc(dlong(day))}</b>.</p>`:'';
  const nextWith=days.find(d=>d>day&&(D[d]||[]).length);
  const B=N.base,bt=B?` League base rates${B.span?' ('+esc(B.span)+(B.games?', '+Number(B.games).toLocaleString()+' games':'')+')':''}: ${B.fav_win!=null?`favorites win ${pc(B.fav_win)}, `:''}${B.home_win!=null?`the home team ${pc(B.home_win)}, `:''}${B.ot!=null?`${(B.ot*100).toFixed(1)}% of games go past regulation`:''}${B.so!=null?` (${(B.so*100).toFixed(1)}% to a shootout)`:''}.`:'';
  box.innerHTML=head('Regular season',esc(dlong(day)),sub)+jmp+rail+
   `<div class="nhrnav">${i>0?`<a class="lk" href="#nhl-day-${days[i-1]}">← ${esc(dlong(days[i-1]))}</a>`:'<span></span>'}
    ${L.length>1&&L.some(g=>g.mk)?`<div class="nhsort">Order<div class="chips" role="group" aria-label="Order games"><button class="chip" data-sort="time" aria-pressed="${NSORT==='time'}">Start time</button><button class="chip" data-sort="fav" aria-pressed="${NSORT==='fav'}">Biggest favorite</button></div></div>`:''}
    ${i<days.length-1?`<a class="lk" href="#nhl-day-${days[i+1]}">${esc(dlong(days[i+1]))} →</a>`:'<span></span>'}</div>`+
   (L.length?`<div class="ucl-rows">${L.map(row).join('')}</div>`:`<p class="empty" style="margin-top:14px">No NHL games on ${esc(dlong(day))}.${nextWith?` <a href="#nhl-day-${nextWith}">See the next slate →</a>`:''}</p>`)+
   `<p class="note" style="margin-top:16px">The bar is the market's view: DraftKings moneylines with the bookmaker margin removed. My model's chance sits below it once the model has run. Hockey moneylines include overtime and the shootout, so the two sides add to 100%.${bt} Goalie tags: <i class="nhgs c">Confirmed</i> named by the team or seen in warmups, <i class="nhgs e">Expected</i> the probable starter, <i class="nhgs u">Unconfirmed</i> not reported yet. OTL = lost in overtime or a shootout, which still earns one standings point.${N.credit?' '+esc(N.credit):''}</p>`;
  box.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{location.hash='#nhl-day-'+b.dataset.day});
  box.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{NSORT=b.dataset.sort;nhday(day)});
  const on=box.querySelector('.nhrail [aria-pressed=true]');if(on){const r=on.parentElement;r.scrollLeft=on.offsetLeft-r.clientWidth/2+on.clientWidth/2}}

/* ---------- one game, in tabs ---------- */
let NTAB='over';
function nhgame(id,tab){const box=$('#v-nhl'),g=G[id];if(!g){box.innerHTML='<div class="gdbar"><a class="lk" href="#nhl">← Games</a></div><p class="empty">That game is not on file.</p>';return}
  const fin=g.st==='post',D=(N.det||{})[id]||{};
  const tabs=[['over','Overview'],...(fin?[['rev','Review']]:[]),['side','Side by side'],['hist','History'],['ha','Home vs away'],['play','Players']];
  if(tab)NTAB=tab;if(!tabs.some(t=>t[0]===NTAB))NTAB='over';
  const A=g.a||{},H=g.h||{},day=DAYOF[id];
  box.innerHTML=`<div class="gdbar"><a class="lk" href="#nhl-day-${day}">← All games on ${esc(dlong(day))}</a></div>`+head('Regular season','',`${esc(dlong(day))}${g.t?' · '+et(g.t)+' '+TZL:''}${g.venue?' · '+esc(g.venue):''}${g.tv?.length?' · '+esc(g.tv.join(', ')):''}`)+
   `<div class="uteams"><div class="h"><small class="nloc">${esc(T(A.ab).loc)}</small><h3>${esc(T(A.ab).nick)}</h3><small>Away${tinfo(A.ab)?' · '+esc(tinfo(A.ab)):''}</small>${g.st==='pre'?b2bTag(g,'a'):''}</div>
    <div class="uxg">${fin||g.st==='in'?`${esc(A.score??'')}<span style="color:var(--dim);padding-inline:6px">–</span>${esc(H.score??'')}<small>${esc(g.det)}</small>`:`<span style="font-size:.55em">${g.t?et(g.t):'TBD'}</span><small>ET puck drop</small>`}</div>
    <div class="a"><small class="nloc">${esc(T(H.ab).loc)}</small><h3>${esc(T(H.ab).nick)}</h3><small>Home${tinfo(H.ab)?' · '+esc(tinfo(H.ab)):''}</small>${g.st==='pre'?b2bTag(g,'h'):''}</div></div>
   <div class="utabs" role="tablist" aria-label="Game sections">${tabs.map(([k,l])=>`<button role="tab" data-nt="${k}" aria-selected="${k===NTAB}">${l}</button>`).join('')}</div><div id="nhpane" role="tabpanel"></div>`;
  const pane=$('#nhpane'),draw=()=>{pane.innerHTML=({over:ntOver,rev:ntRev,side:ntSide,hist:ntHist,ha:ntHA,play:ntPlay})[NTAB](g,D);if(NTAB==='play')propWire(g,D)};
  box.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>{NTAB=b.dataset.nt;box.querySelectorAll('[data-nt]').forEach(x=>x.setAttribute('aria-selected',x===b));draw()});draw()}

function chanceCard(g){const m=g.mk,A=g.a,H=g.h,o=g.odds||{};let h='';
  if(!m||m.a==null)h+=`<div class="nhbig"><h4>Who wins · market</h4><p class="note" style="margin:0">DraftKings hasn't posted a moneyline yet.</p></div>`;
  else{const af=m.a>m.h,ml=o.ml||[],mlo=o.mlo;
    h+=`<div class="nhbig"><h4><span>Who wins · market</span><span>${g.st==='post'?'last line before puck drop':'incl. OT and shootout'}</span></h4>
     <div class="pp"><div><b class="${af?'g':'r'}">${pc(m.a)}</b><span>${esc(A.ab)} ${odd(ml[0])}</span></div><div><b class="${af?'r':'g'}">${pc(m.h)}</b><span>${odd(ml[1])} ${esc(H.ab)}</span></div></div>
     <div class="ubar"><i class="${af?'g':'r'}" style="width:${m.a*100}%"></i><i class="${af?'r':'g'}" style="width:${m.h*100}%"></i></div>
     <small>DraftKings moneyline with the margin removed.${mlo&&mlo.length===2&&ml.length===2?` Opened ${esc(A.ab)} ${odd(mlo[0])} / ${esc(H.ab)} ${odd(mlo[1])}${num(ml[1])<num(mlo[1])?`: money has moved toward ${esc(H.ab)}`:num(ml[1])>num(mlo[1])?`: money has moved toward ${esc(A.ab)}`:''}.`:''}</small></div>`}
  if(!hasM(g))return h+`<div class="nhbig off"><h4><span>Who wins · my model</span>${pend()}</h4><div class="pp"><div><b style="color:var(--dim)">—</b><span>${esc(A.ab)}</span></div><div><b style="color:var(--dim)">—</b><span>${esc(H.ab)}</span></div></div>
   <div class="nhends" aria-label="How the game ends, pending"><div>${esc(A.ab)} wins in regulation</div><div class="y">Goes to OT</div><div>${esc(H.ab)} wins in regulation</div></div>
   <small>No model run for this game yet${g.st==='post'?'':' (it runs once DraftKings posts a line)'}. The model card shows each team's chance with its edge over the market beside it, and a three-part bar: regulation win, goes to overtime, regulation win.</small></div>`;
  const M=g.m,af=M.pa>M.ph,eA=M.ml?.edge_a,eH=M.ml?.edge_h;
  const three=M.rh!=null&&M.ra!=null&&M.pot!=null,ra=af?'g':'r',rh=af?'r':'g';
  const seg=(c,v,l)=>`<div class="${c}" style="flex:${Math.max(+v,.0001)}" title="${esc(l)} ${pc(v)}">${v>=.12?pc(v):''}</div>`;
  const run=[M.run==='pregame'?'Pre-game run':M.run==='morning'?'Morning run':'',M.at?esc(M.at):'',M.goalies==='confirmed'?'goalies confirmed':M.goalies==='expected'?'with expected goalies':''].filter(Boolean).join(' · ');
  return h+`<div class="nhbig"><h4><span>Who wins · my model</span><span>${run||'incl. OT and shootout'}</span></h4>
   <div class="pp"><div><b class="${af?'g':'r'}">${pc(M.pa)}</b><span>${esc(A.ab)}${eA!=null?` <em>edge ${pts(eA)}</em>`:''}</span></div><div><b class="${af?'r':'g'}">${pc(M.ph)}</b><span>${eH!=null?`<em>edge ${pts(eH)}</em> `:''}${esc(H.ab)}</span></div></div>
   ${three?`<div class="nhends on" role="img" aria-label="${esc(A.ab)} wins in regulation ${pc(M.ra)}, goes to overtime ${pc(M.pot)}, ${esc(H.ab)} wins in regulation ${pc(M.rh)}">${seg(ra,M.ra,A.ab+' wins in regulation')}${seg('y',M.pot,'Goes to OT')}${seg(rh,M.rh,H.ab+' wins in regulation')}</div>
   <div class="nhendk"><span>${esc(A.ab)} in regulation <b>${pc(M.ra)}</b></span><span>Goes to OT <b>${pc(M.pot)}</b>${M.pso!=null?` · shootout <b>${pc(M.pso)}</b>`:''}</span><span>${esc(H.ab)} in regulation <b>${pc(M.rh)}</b></span></div>`:''}
   <small>Who wins matches DraftKings' no-vig price: tested on 6,500 games, nothing beat the closing line, so the model does not move it and shows no edge. What the model adds is how the game splits: a regulation win either way, or overtime (checked on 2024-26 games: overtime 22.0% predicted vs 22.7% actual, shootouts 7.1% vs 7.5%; game to game, the overtime chance is about as informative as the league rate, so read it as context, not a pick).${three?' The three-part bar splits the game: a regulation win either way, or the game going to overtime (yellow).':''}</small></div>`}

function goalieCards(g,D){const card=(t,side,list)=>{const s=t.g,me=s&&(list||[]).find(x=>x.n===s.n),fromL=(N.gl||[]).find(x=>s&&x.n===s.n),r=me?{gp:me.gp,rec:`${me.w}-${me.l}-${me.otl}`,sv:me.sv,gaa:me.gaa,so:me.so}:fromL?{gp:fromL.gp,rec:`${fromL.w}-${fromL.l}-${fromL.otl}`,sv:fromL.sv,gaa:fromL.gaa,so:fromL.so}:null;
    const others=(list&&list.length?list:(N.gl||[]).filter(x=>x.tm===t.ab)).filter(x=>!s||x.n!==s.n);
    const src=s?`Source: ${esc(s.src||'ESPN')} (${esc(s.st||'Unconfirmed')})${s.dfo?` · DailyFaceoff: ${esc(s.dfo.n||'')}${s.dfo.st?' ('+esc(s.dfo.st)+')':''}${s.dfo.t?' · '+esc(s.dfo.t):''}`:''}`:'Source: not reported yet';
    return`<div class="nhgc ${side}"><div class="gh"><div><small>${esc(T(t.ab).nick)} in goal</small><b>${s&&s.n?esc(s.n):'Not reported'}</b></div><div>${s&&s.n?`<i class="nhgs ${gstat(s.st)}">${esc(s.st||'Unconfirmed')}</i>`:'<i class="nhgs u">Unconfirmed</i>'} ${dis(s)}</div></div>
     ${r?`<div class="gst"><div><small>GP</small><b>${esc(r.gp)}</b></div><div><small>W-L-OTL</small><b>${esc(r.rec)}</b></div><div><small>SV%</small><b>${esc(r.sv)}</b></div><div><small>GAA</small><b>${esc(r.gaa)}</b></div><div><small>SO</small><b>${esc(r.so)}</b></div></div>`:'<p class="note" style="margin:0">Season line appears once a starter is named.</p>'}
     ${s&&s.agree===false?'<div class="bk"><b>Sources disagree</b> on the starter. The model re-runs when it settles.</div>':''}
     ${others.length?`<div class="bk">If they don't start: ${others.slice(0,2).map(o=>`${esc(o.n)} (${esc(o.sv)} SV%, ${esc(o.gp)} GP)`).join(' · ')}</div>`:''}
     <div class="bk">${src}</div></div>`};
  return`<div class="nhgd">${card(g.a,'l',D.goalies?.away)}${card(g.h,'r',D.goalies?.home)}</div>`}

function ntOver(g,D){const A=g.a,H=g.h,o=g.odds,fin=g.st==='post',M=hasM(g)?g.m:null;let h='';
  if(fin)h+=boxLine(g,D);
  h+=`<div class="nhchance">${chanceCard(g)}</div>`;
  h+=`<h3 class="ush">Starting goalies <small>the biggest single factor in one hockey game</small></h3>`+(fin&&(A.gp||H.gp)?gameGoalies(g):goalieCards(g,D));
  if(o&&(o.pl||o.tot)){const fav=g.mk&&g.mk.a!=null?(g.mk.a>g.mk.h?0:1):(num(o.pl?.[0]?.[0])<0?0:1),fa=fav?H.ab:A.ab,da=fav?A.ab:H.ab,pl=o.pl?nv(o.pl[0][1],o.pl[1][1]):null,tt=o.tot?nv(o.tot[1],o.tot[2]):null;
    const mp=M&&M.pl,mt=M&&M.tot;
    h+=`<h3 class="ush">Lines <small>DraftKings${fin?', last line before puck drop':''}; market chance = price with the margin removed</small></h3><div class="nhlines">
     ${o.pl?`<div><small>Puck line · market</small><div class="lq"><span>${esc(fa)} wins by 2+</span><b>${pl?pc(pl[fav]):'–'}</b></div><div class="lp">${esc(fa)} <b>${esc(o.pl[fav][0])}</b> ${odd(o.pl[fav][1])} · ${esc(da)} <b>${esc(o.pl[1-fav][0])}</b> ${odd(o.pl[1-fav][1])}</div>
       ${mp&&mp.p_fav!=null?`<div class="lp">${mp.p_sim!=null?'Model (follows the market price)':'My model'}: <b>${esc(mp.fav)} ${esc(mp.line??'-1.5')}</b> ${pc(mp.p_fav)}${mp.edge_fav!=null?` · edge ${pts(mp.edge_fav)}`:mp.nv_fav!=null?` · edge ${pts(mp.p_fav-mp.nv_fav)}`:''}${mp.p_sim!=null?` <span title="The simulation's own puck-line chance. The chance shown follows DraftKings' price, which tested slightly better.">(sim ${pc(mp.p_sim)})</span>`:''}</div>`:`<div class="lp">My model: ${pend('pending')}</div>`}</div>`:''}

   <p class="note">${g.st==='pre'?'Rest is context only: the back-to-back effect is a tracked lead, not proven, and it does not change any chance shown. ':''}${a&&b?'':'Standings are not on file for one of these teams. '}</p>`;

function ntHA(g){const A=g.a,H=g.h,a=ST[A.ab],b=ST[H.ab];if(!a||!b)return'<p class="empty">Home and road records are not on file for this game.</p>';

/* props: likelihood first, DraftKings price and edge beside it; "most likely" order hides prices longer than -400 */
const PMK={goal:'Goals',ast:'Assists',pts:'Points',sog:'Shots on goal',saves:'Goalie saves'};
let NPM='all';
function propLabel(p){const side=p.side==='under'?'Under':'Over';if(p.mk==='goal'&&(p.side==='yes'||p.line==null||+p.line===.5))return'Anytime goal';
  const w={goal:'goals',ast:'assists',pts:'points',sog:'shots on goal',saves:'saves'}[p.mk]||esc(p.mk);return`${side} ${esc(p.line)} ${w}`}
function propBlock(g){const P=g.props;
  if(!P||!P.length)return`<h3 class="ush">Player props <small>my model's chance first, the DraftKings price beside it</small></h3><div class="nhpendbox"><b>Props</b>${g.st==='pre'?'Props appear on game day once the model has run.':'No props were on file for this game.'} ${pend()}</div>`;
  const cap=num(N.longest)??-400,capT=odd(cap),long=p=>{const x=num(p.price);return x!=null&&x<cap};
  const mks=Object.keys(PMK).filter(k=>P.some(p=>p.mk===k));if(NPM!=='all'&&!mks.includes(NPM))NPM='all';
  const L=P.filter(p=>NPM==='all'||p.mk===NPM),hid=L.filter(p=>!p.hold&&long(p)).length;
  const MO=N.props_model!==false,mc=p=>p.nv!=null?p.nv:p.imp;
  if(!MO){const live=L.filter(p=>!p.hold&&!long(p)&&mc(p)!=null).sort((a,b)=>mc(b)-mc(a)),hold=L.filter(p=>p.hold);
   const tr=p=>`<tr><td class="pl"><b>${esc(p.n)}</b><small>${esc(p.tm)}${p.pos?' · '+esc(p.pos):''}</small></td><td>${propLabel(p)}</td>${p.hold?`<td class="hold" colspan="2">Waiting for confirmed starter</td>`:`<td class="n p">${pc(mc(p))}${p.nv==null?` <i title="DraftKings' implied chance, including the book margin">implied</i>`:''}</td><td class="n">${odd(p.price)}</td>`}</tr>`;
   return`<h3 class="ush">Player props <small>most likely first · DraftKings' chance and price</small></h3>
   <div class="chips" role="group" aria-label="Prop market"><button class="chip" data-pm="all" aria-pressed="${NPM==='all'}">All</button>${mks.map(k=>`<button class="chip" data-pm="${k}" aria-pressed="${NPM===k}">${PMK[k]}</button>`).join('')}</div>
   ${live.length||hold.length?`<div class="utb nhprops"><table><thead><tr><th>Player</th><th>Prop</th><th class="n k">Market chance</th><th class="n">DK price</th></tr></thead><tbody>${live.map(tr).join('')}${hold.map(tr).join('')}</tbody></table></div>`:'<p class="empty">No props in this market.</p>'}
   <p class="note">The props model is being tested before it is shown: it is graded every night at these prices, and its chances and edges come onto this page once they hold up. Until then the chance shown is DraftKings' own, with the margin removed when both sides are posted. Anytime-goal props are one-way, so their chance is "implied" (includes the book margin, so it runs high).${hid?` ${hid} prop${hid>1?'s are':' is'} hidden because the price is longer than ${capT}.`:` Prices longer than ${capT} are left off this list.`} Goalie-save props wait for a confirmed starter, because they void if that goalie doesn't start.</p>`}
  const live=L.filter(p=>!p.hold&&!long(p)&&p.p!=null).sort((a,b)=>b.p-a.p),hold=L.filter(p=>p.hold);
  const tr=p=>`<tr><td class="pl"><b>${esc(p.n)}</b><small>${esc(p.tm)}${p.pos?' · '+esc(p.pos):''}</small></td><td>${propLabel(p)}</td>${p.hold?`<td class="hold" colspan="4">Waiting for confirmed starter</td>`:`<td class="n p">${pc(p.p)}</td><td class="n">${odd(p.price)}</td><td class="n">${p.nv!=null?pc(p.nv):p.imp!=null?`${pc(p.imp)} <i title="DraftKings' implied chance, including the book margin">implied</i>`:'–'}</td><td class="n">${p.edge!=null?pts(p.edge):'–'}</td>`}</tr>`;
  return`<h3 class="ush">Player props <small>most likely first · the chance, then the DraftKings price</small></h3>
   <div class="chips" role="group" aria-label="Prop market"><button class="chip" data-pm="all" aria-pressed="${NPM==='all'}">All</button>${mks.map(k=>`<button class="chip" data-pm="${k}" aria-pressed="${NPM===k}">${PMK[k]}</button>`).join('')}</div>
   ${live.length||hold.length?`<div class="utb nhprops"><table><thead><tr><th>Player</th><th>Prop</th><th class="n k">Chance</th><th class="n">DK price</th><th class="n">Market chance</th><th class="n">Edge</th></tr></thead><tbody>${live.map(tr).join('')}${hold.map(tr).join('')}</tbody></table></div>`:'<p class="empty">No props in this market.</p>'}
   <p class="note">Chance = my model blended with DraftKings' price; the weights were fit on the 2026 playoffs and October and tested on November at real prices (4,700+ props per market). Market chance is DraftKings' price with the margin removed; anytime goal is one-way, so its margin was estimated from those games (about 13%). Edge = chance minus market, in percentage points. <b>No props edge has held up yet:</b> on the November test the blend matched the market's accuracy but did not beat it, so treat every edge here as unproven.${N.props_note?' '+esc(N.props_note):''}${hid?` ${hid} prop${hid>1?'s are':' is'} hidden because the price is longer than ${capT}.`:` Prices longer than ${capT} are left off this list.`} Goalie-save props wait for a confirmed starter, because they void if that goalie doesn't start.</p>`}

function ntPlay(g,D){const A=g.a,H=g.h,fin=g.st==='post';const tbl=ab=>{const L=(N.sk||[]).filter(s=>s.tm===ab).sort((a,b)=>b.pts-a.pts).slice(0,10);

     <td class="${b.status==='won'?'w':b.status==='lost'?'l':''}"><b>${b.status==='open'?'Open':b.status==='push'?'Push':b.status==='won'?'Won '+usd(pl(b)):'Lost '+usd(-b.stake)}</b></td>

const w0open=()=>{try{return localStorage.getItem('cwin')==='0'?'':' open'}catch(e){return' open'}};
function week(w,gid){

  const pick=gs.find(g=>g.id===gid)||gs.find(g=>g.report&&g.status!=='final')||gs.find(g=>g.status!=='final')||gs[0];
  $('#week').innerHTML=`<div class="wsum">${['final','book','lines','early'].filter(k=>n(k)).map(k=>stat(n(k),ST[k],k,STN[k])).join('')}${fin.length?stat(`${right}-${fin.length-right}`,'Picks','pk',`Pre-game winner picks this week: ${right} right, ${fin.length-right} wrong`):''}</div>
  <div class="gwrap"><div class="gstrip" id="gstrip" role="group" aria-label="Games">${days.map(d=>`<div class="gday"><b>${dt(d).toLocaleDateString('en-US',{weekday:'short'})}</b><small>${md(d)}</small></div>`+gs.filter(g=>g.date===d).map(tile).join('')).join('')}</div></div>
  <div id="gdetail"></div>`;

  sel(slug(pick.id))}

function sel(sl){const g=G.find(x=>slug(x.id)===sl);if(!g)return;
  document.querySelectorAll('#gstrip [data-g]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===sl));
  const tb=document.querySelector(`#gstrip [data-g="${sl}"]`),st=$('#gstrip');if(tb)st.scrollTo({left:tb.offsetLeft-st.offsetLeft-(st.clientWidth-tb.offsetWidth)/2,behavior:'smooth'});
  const box=$('#gdetail'),ln=`<dl class="ln dl2"><div><dt>Market</dt><dd>${g.spread==null?'<span class="nl">No line yet</span>':spread(g)+(g.total!=null?` · O/U ${g.total}`:'')}</dd></div><div><dt>Our line</dt><dd>${ourline(g)} · ${f1(g.mh+g.ma)}</dd></div><div><dt>Kickoff</dt><dd>${nflwhen(g,' ')}</dd></div><div><dt>Stadium</dt><dd>${esc(g.stadium||'–')}</dd></div></dl>`;

  else{const why=g.status==='final'?'This game was played before Game Books were being built, so only the result and our pre-game numbers are kept.':g.status==='lines'?'The full Game Book (simulation, player forecasts, picks) is built on game week, after the injury reports. Until then this is the market-based projection.':'No market line yet, so this is our ratings-only projection. It will move once lines post and the Game Book is built on game week.';
    box.innerHTML=`<div class="gdbar"><span class="sd ${g.status}">${ST[g.status]}</span><b>${g.away} at ${g.home}</b></div>${g.status==='final'&&revget(`nfl:${g.away}@${g.home}`)?revhtml(revget(`nfl:${g.away}@${g.home}`)):''}${matchup(g.away,g.home,g)}${ln}<p class="note">${why}</p>`}}

/* Game Books load into a shadow root so their own styles cannot touch the hub's, and vice versa */
const BOOKS=new Map();
async function bookDoc(file){if(!BOOKS.has(file))BOOKS.set(file,fetch(file).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>{const d=new DOMParser().parseFromString(t,'text/html');
  const css=[...d.querySelectorAll('style')].map(x=>x.textContent).join('\n').replace(/:root/g,':host');return{d,css}}));return BOOKS.get(file)}
async function book(g,host=$('#gbhost')){const[file,id]=g.report.split('#');
  try{const{d,css}=await bookDoc(file);if(!host.isConnected)return;const art=d.getElementById(id);if(!art)throw new Error('game not found in '+file);
    const root=host.shadowRoot||host.attachShadow({mode:'open'});
    root.innerHTML=`<style>${css}\n:host{display:block;color:var(--fg);font:15px/1.55 var(--b)}[hidden]{display:none!important}.game>.gh{display:none}</style>`;
    const a=art.cloneNode(true);a.hidden=false;root.appendChild(a);host.firstElementChild&&host.firstElementChild.tagName==='P'&&host.firstElementChild.remove();wire(root);revtab(root,g.away&&g.home?`nfl:${g.away}@${g.home}`:'cfb:'+g.id)}
  catch(e){host.innerHTML=`<p class="empty">The Game Book did not load (${esc(e.message)}). <a href="${esc(g.report)}">Open it as its own page</a>.</p>`}}
function wire(r){const T=[...r.querySelectorAll('.gt')],P=[...r.querySelectorAll('.pane')];
  const s=id=>{P.forEach(p=>p.hidden=p.id!==id);T.forEach(b=>b.setAttribute('aria-selected',b.dataset.p===id))};T.forEach(b=>b.onclick=()=>s(b.dataset.p));if(T.length)s(T[0].dataset.p);
  P.forEach(p=>{const S=[...p.querySelectorAll('.sb')],U=[...p.querySelectorAll('.sub')];if(!S.length)return;const f=id=>{U.forEach(u=>u.hidden=u.id!==id);S.forEach(b=>b.setAttribute('aria-selected',b.dataset.s===id))};S.forEach(b=>b.onclick=()=>f(b.dataset.s));f(S[0].dataset.s)});
  r.querySelectorAll('[data-tab]').forEach(a=>a.onclick=()=>{s(a.dataset.tab);const b=a.dataset.sub&&r.querySelector('.sb[data-s="'+a.dataset.sub+'"]');if(b)b.click();const g=r.querySelector('.gtabs');if(g)g.scrollIntoView({block:'start'})});
  r.querySelectorAll('[data-dlg]').forEach(b=>b.onclick=()=>{const d=r.getElementById?r.getElementById(b.dataset.dlg):r.querySelector('[id="'+b.dataset.dlg+'"]');if(d)d.showModal()});
  r.querySelectorAll('dialog.h2d').forEach(d=>{d.onclick=e=>{if(e.target===d)d.close()};const x=d.querySelector('[data-close]');if(x)x.onclick=()=>d.close()});
  r.querySelectorAll('select[data-win]').forEach(x=>{const box=x.closest('.mblock'),f=()=>box.querySelectorAll('[data-w]').forEach(d=>d.hidden=d.dataset.w!==x.value);x.onchange=f;f()});
  r.querySelectorAll('.om').forEach(o=>{const B=[...o.querySelectorAll('[data-om]')],f=k=>{o.querySelectorAll('[data-omv]').forEach(d=>d.hidden=d.dataset.omv!==k);B.forEach(b=>b.setAttribute('aria-pressed',b.dataset.om===k))};B.forEach(b=>b.onclick=()=>f(b.dataset.om));if(B.length)f('sp')})}
function toggle(b){
  const g=G.find(x=>x.id===b.dataset.sbs),box=$('#sbs-'+g.date),open=b.getAttribute('aria-expanded')==='true';
  document.querySelectorAll(`#week [data-sbs]`).forEach(x=>{const y=G.find(z=>z.id===x.dataset.sbs);if(y.date===g.date){x.setAttribute('aria-expanded','false');$('#g-'+y.id).classList.remove('sel')}});

/* ---- side by side: away (or the left team) always on the left ---- */
function mrow(lab,lv,rv,lr,rr,tip){
  const better=lr==null||rr==null||lr===rr?null:lr<rr?'l':'r';
  const side=(v,r,c)=>`<div class="${c}${better===c?' win':''}"><span class="v">${v}${r!=null?`<i>#${r}</i>`:''}</span>${r!=null?`<span class="bar"><span style="width:${((33-r)/32*100).toFixed(0)}%"></span></span>`:'<span></span>'}</div>`;
  return`<div class="mrow"${tip?` title="${esc(tip)}"`:''}>${side(lv,lr,'l')}<div class="lab">${lab}</div>${side(rv,rr,'r')}</div>`}
const UNIT={off:['offense','gains'],def:['defense','allows']},SUBLAB={to:'offense loses · defense forces',sacks:'offense allows · defense makes'};
const sidehead=(lt,ls,rt,rs)=>`<div class="mcols"><div class="l"><b>${lt} ${UNIT[ls][0]}</b><small>what ${lt} ${UNIT[ls][1]}</small></div><div class="lab">2026 season average<br># = league rank, 1 is best</div><div class="r"><b>${rt} ${UNIT[rs][0]}</b><small>what ${rt} ${UNIT[rs][1]}</small></div></div>`;
function units(lt,ls,rt,rs){return sidehead(lt,ls,rt,rs)+D.metrics.map(m=>{const a=T[lt].unit[ls][m.key],b=T[rt].unit[rs][m.key];
  return mrow(m.label+(SUBLAB[m.key]?`<small>${SUBLAB[m.key]}</small>`:''),fmt(a.v,m.fmt),fmt(b.v,m.fmt),a.r,b.r,`Last 3 games: ${lt} ${fmt(a.l3,m.fmt)}, ${rt} ${fmt(b.l3,m.fmt)}`)}).join('')}
const UNOTE='Green is the better-ranked unit in that row. It compares season form, not a projection for this game, and is not adjusted for opponents faced. Hover a row for the last 3 games.';
function matchup(a,h,g){
  const A=T[a],H=T[h];let pa,ph,pw,sub;
  if(g){pa=g.status==='final'?g.sa:f1(g.ba);ph=g.status==='final'?g.sh:f1(g.bh);pw=g.ph;sub=g.status==='final'?`Final · projected ${f1(g.ba)}–${f1(g.bh)}`:`${ST[g.status]} · market ${spread(g)}${g.total!=null?`, O/U ${g.total}`:''}`}
  else{const xa=D.mu+A.adj_off-H.adj_def,xh=D.mu+H.adj_off-A.adj_def;pa=f1(xa);ph=f1(xh);pw=phi((xh-xa)/D.sd);sub=`Neutral field, our ratings only · fair odds ${a} ${am(1-pw)}, ${h} ${am(pw)}`}
  return`<div class="mhead"><div class="tm"><b>${a}</b><span>${esc(A.name)} · ${A.rec}</span></div>
  <div class="mid"><div class="pts"><b>${pa}</b><small>${g&&g.status==='final'?'final':'projected'}</small><b>${ph}</b></div>
  ${wbar(pw)}<small>Win chance ${a} ${pc(1-pw)} · ${h} ${pc(pw)}</small><small>${esc(sub)}</small></div>
  <div class="tm r"><b>${h}</b><span>${esc(H.name)} · ${H.rec}</span></div></div>
  <section class="mblock"><h4>Strength <span class="kind pred">Predictive</span></h4>
  ${mrow('Adjusted offense, pts vs avg',sg(A.adj_off),sg(H.adj_off),A.adj_off_r,H.adj_off_r)}${mrow('Adjusted defense, pts vs avg',sg(A.adj_def),sg(H.adj_def),A.adj_def_r,H.adj_def_r)}
  <p class="note">Opponent-adjusted points per game from the model's ratings; rank 1 is best. These drive our line.</p></section>
  <section class="mblock"><h4>When ${a} has the ball <span class="kind ctx">Context</span></h4>${units(a,'off',h,'def')}<p class="note">${UNOTE}</p></section>
  <section class="mblock"><h4>When ${h} has the ball <span class="kind ctx">Context</span></h4>${units(a,'def',h,'off')}<p class="note">${UNOTE}</p></section>
  ${g&&g.report?`<p><a class="btn fill" href="${esc(g.report)}">Open the full Game Book</a></p>`:''}`}

/* ---- compare any two teams ---- */
(function(){const ts=Object.keys(T).sort(),g0=G.find(g=>g.week===D.week&&g.status!=='final')||G.find(g=>g.week===D.week);
  const opt=s=>ts.map(t=>`<option value="${t}"${t===s?' selected':''}>${t} ${esc(T[t].name)}</option>`).join('');

  <div class="cmp"><label for="ca">Left team<select id="ca">${opt(g0.away)}</select></label><label for="cb">Right team<select id="cb">${opt(g0.home)}</select></label></div><div id="cmpo"></div>`;

/* ---- track record ---- */
(function(){const t=D.track;let h=`<h2>Track record</h2><p class="note">Scored after each week by the Tuesday review. Calibration means a 70% call should land about 70% of the time.</p>`;
  const gr=t.games,gn=gr.reduce((s,x)=>s+x.n,0),gw=gr.reduce((s,x)=>s+x.right,0);
  h+=`<div class="kpis">`;
  if(t.likely)h+=`<div class="kpi"><small>Most likely tier · 70%+ · live</small><b>${pc(t.likely.hit,1)}</b><p>hit on ${t.likely.n} calls vs ${pc(t.likely.pred,1)} predicted (±${pc(t.likely.moe,1)})</p></div>`;
  if(gn)h+=`<div class="kpi"><small>Pre-game winner picks</small><b>${gw}-${gn-gw}</b><p>${pc(gw/gn,1)} right · mostly the market favorite, since the score is 90% market</p></div>`;
  if(t.clv)h+=`<div class="kpi"><small>Closing line value · value-tier props</small><b>${t.clv.props_mean==null?'–':sg(t.clv.props_mean)}</b><p>${t.clv.props_n} picks, ${pc(t.clv.props_pos)} moved our way. Positive means the line moved toward us.</p></div>`;
  h+=`</div>`;
  const RU=D.rules;if(RU){const f=x=>!x||!x.n?'–':`${pc(x.pct,1)} <small>of ${x.n.toLocaleString()}</small>`,u=x=>!x||!x.n?'–':`<span class="${x.units>0?'w':'l'}">${(x.units>0?'+':'')+x.units.toFixed(1)}u</span>`,am=a=>a==null?'':(a>0?'+':'')+a;
    const lv=k=>(RU.live||[]).find(x=>x.rule===k)||{};
    h+=`<section class="mblock"><h4>Spread rules, tracked live <span class="kind ctx">leads, not proven</span></h4>
    <p class="note">The five-season study found no team-stat model that beats the spread. What did cover a little more than half the time were these market patterns. Each pick is logged before kickoff at the line on offer and graded at that line. A bettor needs ${pc(RU.need,1)} at −110 to break even, and none of these has cleared that with room to spare.</p>
    <div class="tw"><table><thead><tr><th>Rule</th><th>Live record</th><th>Live units</th><th>Waiting</th><th>2026 at the close</th><th>2021–25</th><th>2006–20</th></tr></thead><tbody>${RU.hist.map(x=>{const L=lv(x.rule);return`<tr><td>${esc(x.label)}</td><td>${L.n?`${L.w}-${L.n-L.w} <small>(${pc(L.pct)})</small>`:'–'}</td><td>${u(L)}</td><td>${L.open||0}</td><td>${f(x.now)} ${u(x.now)}</td><td>${f(x.five)} ${u(x.five)}</td><td>${f(x.long)} ${u(x.long)}</td></tr>`}).join('')}</tbody></table></div>
    ${RU.week.picks.length?`<h5 class="rh5">${esc(wname(RU.week.n))} picks under these rules</h5><div class="tw"><table><thead><tr><th>Team</th><th>Line</th><th>Price</th><th>Against</th><th>Why</th></tr></thead><tbody>${RU.week.picks.map(p=>`<tr><td><b>${p.team}</b></td><td>${p.line>0?'+':''}${p.line}</td><td>${am(p.price)}</td><td>${p.opp}</td><td style="text-align:left;white-space:normal">${p.rules.map(esc).join('; ')}</td></tr>`).join('')}</tbody></table></div>`:''}
    <p class="note">"Live" counts only picks logged before kickoff, starting ${esc(wname(RU.week.n||D.week))}. "At the close" applies the rule to the closing line after the fact. Units are flat 1-unit bets at the listed price. The quarterback rule uses the newest depth chart and is dropped if the usual quarterback starts after all.</p></section>`}
  if(t.bands.length){h+=`<section class="mblock"><h4>Calibration · every scored player forecast</h4><div class="tw"><table><thead><tr><th>Model said</th><th>Forecasts</th><th>Predicted</th><th>Hit</th><th style="width:40%">Predicted vs hit</th></tr></thead><tbody>${t.bands.map(b=>`<tr><td>${b.band}</td><td>${b.n}</td><td>${pc(b.pred,1)}</td><td>${pc(b.hit,1)}</td><td><span class="hb p" style="width:${(b.pred*100).toFixed(0)}%"></span><span class="hb" style="width:${(b.hit*100).toFixed(0)}%"></span></td></tr>`).join('')}</tbody></table></div><p class="note">Grey bar is predicted, green is what happened. Close bars mean honest probabilities.</p></section>`}

  const draw=()=>{L.hidden=!hits.length;L.innerHTML=hits.map((p,i)=>`<li><button type="button" data-id="${p.id}" class="${i===on?'on':''}">${badge(p.pos)}<span>${esc(p.n)}</span><small>${p.tm} · ${p.g[0][PC.s]}–${p.g[p.g.length-1][PC.s]}</small></button></li>`).join('');
    L.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();go(b.dataset.id)})};
  const go=id=>{q.value='';hits=[];draw();q.blur();location.hash='player-'+id};
  q.oninput=()=>{if(!PD)return;const t=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);on=0;
    hits=!t.length?[]:PD.players.filter(p=>{const n=p.n.toLowerCase();return t.every(x=>n.includes(x))||(t.length===1&&p.tm.toLowerCase()===t[0])})
      .sort((a,b)=>(b.n.toLowerCase().startsWith(t[0])-a.n.toLowerCase().startsWith(t[0])))
      .slice(0,10);draw()};
  q.onkeydown=e=>{if(!hits.length)return;if(e.key==='ArrowDown'){on=(on+1)%hits.length;draw();e.preventDefault()}else if(e.key==='ArrowUp'){on=(on-1+hits.length)%hits.length;draw();e.preventDefault()}
    else if(e.key==='Enter'){go(hits[on].id)}else if(e.key==='Escape'){hits=[];draw()}};
  q.onblur=()=>setTimeout(()=>{hits=[];draw()},120)}

function planding(){const y=PD.through.season;

  $('#pbody').innerHTML=`<div class="chips" role="group" aria-label="Position">${['ALL','QB','RB','WR','TE'].map(k=>`<button class="chip" data-c="${k}" aria-pressed="${k===pchip}">${k==='ALL'?'All':k}</button>`).join('')}</div>

  <div class="pgrid">${list.map(({p,g,fp})=>`<button class="pcard" data-id="${p.id}">${badge(p.pos)}<b>${esc(p.n)}</b><small>${p.tm} · ${(fp/g.length).toFixed(1)} PPR/g · ${g.length} g</small></button>`).join('')}</div></section>`;
  document.querySelectorAll('#pbody [data-c]').forEach(b=>b.onclick=()=>{pchip=b.dataset.c;planding()});

function tiles(rs,pos){const n=rs.length,g=k=>div(sum(rs,k),n),t=(lab,v,sub,k)=>`<div class="tile${k?' k':''}"><small>${lab}</small><b>${v}</b><span>${sub||''}</span></div>`;

    +t('Completion %',sum(rs,'att')?pc(sum(rs,'cmp')/sum(rs,'att'),1):'–',`${sum(rs,'cmp')}/${sum(rs,'att')}`)+t('Yards / attempt',div(sum(rs,'py'),sum(rs,'att')),'')+t('Rush yds / g',g('ry'),`${sum(rs,'rtd')} rush TD`);
  else if(pos==='RB')h=t('Rush yds / g',g('ry'),`${sum(rs,'ry').toLocaleString()} total`,1)+t('Carries / g',g('car'),`${div(sum(rs,'ry'),sum(rs,'car'))} YPC`)+t('Rec yds / g',g('ryd'),`${sum(rs,'rec')} catches`)
    +t('Targets / g',g('tgt'),'')+t('Scrimmage yds / g',g('scr'),'')+t('TD / g',div(td,n,2),`${td} rush + rec TD`);
  else h=t('Rec yds / g',g('ryd'),`${sum(rs,'ryd').toLocaleString()} total`,1)+t('Receptions / g',g('rec'),`${div(sum(rs,'ryd'),sum(rs,'rec'))} Y/R`)+t('Targets / g',g('tgt'),`${sum(rs,'tgt')} total`)
    +t('Catch rate',sum(rs,'tgt')?pc(sum(rs,'rec')/sum(rs,'tgt'),1):'–','')+t('Target share',cell(rs,'tsh'),'avg per game')+t('TD / g',div(td,n,2),`${td} rush + rec TD`);
  return`<div class="tiles">${t('Games',n,'in this view')}${h}${t('PPR pts / g',div(sum(rs,'fp'),n),'')}</div>`}

function chart(rs,k,line){if(!rs.length)return'';const W=760,H=200,pl=34,pr=8,pt=14,pb=26,n=rs.length,vals=rs.map(r=>pv(r,k));
  const mx=Math.max(1,...vals,line||0)*1.08,bw=(W-pl-pr)/n,y=v=>pt+(1-v/mx)*(H-pt-pb),av=vals.reduce((a,b)=>a+b,0)/n;
  let g='';[0,.5,1].forEach(f=>{const v=mx*f/1.08;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${k==='fp'?v.toFixed(0):Math.round(v)}</text>`});
  rs.forEach((r,i)=>{const v=vals[i],x=pl+i*bw,ok=line==null||line===''?true:v>=line;
    g+=`<rect x="${(x+bw*.15).toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(bw*.7,1).toFixed(1)}" height="${Math.max(H-pb-y(v),0).toFixed(1)}" rx="${Math.min(2,bw*.2).toFixed(1)}" fill="${ok?'var(--grn)':'var(--red)'}" fill-opacity="${ok?.9:.6}"><title>${glab(r)} ${vsl(r)}: ${k==='fp'?v.toFixed(1):v} ${SL[k]}</title></rect>`;
    if(i===0||rs[i-1][PC.s]!==r[PC.s])g+=`<text x="${(x+2).toFixed(1)}" y="${H-8}">${r[PC.s]}</text><line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${pt}" y2="${H-pb+4}" stroke="var(--line2)" stroke-dasharray="2 3"/>`});
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(av)}" y2="${y(av)}" stroke="var(--fg)" stroke-dasharray="5 4" opacity=".7"/><text class="av" x="${W-pr}" y="${y(av)-4}" text-anchor="end">avg ${av.toFixed(1)}</text>`;
  if(line!=null&&line!=='')g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(line)}" y2="${y(line)}" stroke="var(--red)" stroke-width="1.5"/>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(SL[k])} by game">${g}</svg>`}

    <p class="note">${PS.type==='reg'?'Regular season only.':PS.type==='post'?'Playoffs only.':'Regular season and playoffs.'} Totals for the whole span; rate columns are computed from the totals.</p></section>`;

  const ch=`<section class="mblock"><h4>Game by game</h4><div class="ctl"><div class="segs" role="group" aria-label="Stat">${CHART[pos].map(k=>`<button data-st="${k}" aria-pressed="${k===PS.stat}">${SL[k]}</button>`).join('')}</div>
    <label>Line to test<input id="fl" type="number" inputmode="decimal" step="0.5" min="0" placeholder="e.g. 60.5" value="${esc(PS.line)}"></label></div>${chart(rs,PS.stat,ln)}
    ${ln!=null&&rs.length?`<p class="hit">Cleared ${ln}+ ${esc(SL[PS.stat])} in <b>${hit} of ${rs.length}</b> games (${pc(hit/rs.length)}) · last ${l10.length}: <b>${h10} of ${l10.length}</b></p>`:`<p class="note">Type a line to see how often he cleared it in the games shown. Past hit rates are context, not a forecast: they ignore role changes, injuries and the opponent.</p>`}</section>`;
  // vs every opponent
  const vc=VSC[pos],opps=[...new Set(rs.map(r=>r[PC.opp]))].map(o=>{const x=rs.filter(r=>r[PC.opp]===o),best=x.reduce((a,r)=>pv(r,vc[1])>pv(a,vc[1])?r:a,x[0]);
    const w=x.filter(r=>r[PC.pf]>r[PC.pa]).length,l=x.filter(r=>r[PC.pf]<r[PC.pa]).length;return{o,x,best,w,l}}).sort((a,b)=>b.x.length-a.x.length||sum(b.x,vc[1])/b.x.length-sum(a.x,vc[1])/a.x.length);
  const vs=`<section class="mblock"><h4>Against every opponent</h4><div class="tw"><table><thead><tr><th>Opponent</th><th>G</th><th>Team W-L</th>${vc.map(k=>`<th>${SL[k]} / g</th>`).join('')}<th>Best game</th></tr></thead><tbody>

const pgrp=p=>{const c=String(p.pos||'F').slice(-1).toUpperCase();return 'GFC'.includes(c)?c:'F'};

   <rect x="0" y="0" width="30" height="140" fill="${z('LC3').f}"/><rect x="470" y="0" width="30" height="140" fill="${z('RC3').f}"/>
   <path d="${arc}" fill="${z('MID').f}"/><rect x="170" y="0" width="160" height="190" fill="${z('PNT').f}"/><path d="M210 0 L210 52 A40 40 0 0 0 290 52 L290 0 Z" fill="${z('RA').f}"/>
   <g class="cln"><path d="${arc}" fill="none"/><rect x="170" y="0" width="160" height="190" fill="none"/><circle cx="250" cy="190" r="60" fill="none"/><path d="M210 52 A40 40 0 0 0 290 52" fill="none"/><circle cx="250" cy="52" r="7.5" fill="none"/><line x1="220" y1="40" x2="280" y2="40"/></g>
   ${tx(250,30,'RA')}${tx(250,140,'PNT')}${tx(95,215,'MID')}${tx(52,70,'LC3')}${tx(448,70,'RC3')}${tx(250,330,'AB3')}</svg>`}
function nbmx(p,G){const M=NBM,pos=pgrp(p),o=p.o,mk=NPS.mk,parts=MKP[mk]||['pts'],per=NMX.per,pi={s:1,l7:2,l15:3}[per];
  const dv=M.dvp[pos]||{},D0=dv[o];let h='<div class="nbmx">';
  /* 1. defense vs position */
  if(D0){const sum=t=>parts.reduce((a,k)=>a+((dv[t]||{})[k]||[0])[0],0),order=Object.keys(dv).sort((a,b)=>sum(a)-sum(b)),rk=order.indexOf(o)+1,v=sum(o);
    const good=rk>=21,mid=rk>=11;
    h+=`<section class="mxc"><h4>${esc(nbt(o).short)} defense vs ${PGN[pos]}</h4>
    <div class="mxban ${good?'rw':mid?'rm':'re'}"><b>${good?'Favorable':mid?'Neutral':'Tough'} matchup</b><span>${esc(o)} allows ${f1(v)} ${parts.map(k=>MKS[k]).join('+')} per game to ${PGN[pos]} (all ${PGN[pos]} combined) — #${rk} of ${order.length}${rk>=21?' (one of the weakest)':rk<=10?' (one of the stingiest)':''}</span></div>
    <div class="mxtab">${[['s','Season'],['l7','L7'],['l15','L15']].map(([k,l])=>`<button data-mper="${k}" aria-pressed="${per===k}">${l}</button>`).join('')}</div>
    <table class="mxt"><thead><tr><th>Stat</th><th>Avg / game</th><th class="${per==='s'?'on':''}">SZN</th><th class="${per==='l7'?'on':''}">L7</th><th class="${per==='l15'?'on':''}">L15</th></tr></thead><tbody>
    ${M.dvk.map(([k,l])=>{const r=D0[k];if(!r)return'';const pct=k==='fgp'||k==='ftp',hit=parts.includes(k);return`<tr class="${hit?'hit':''}"><td>${l}<i class="mxb ${rkc(r[pi])}" style="width:${(r[pi]||0)/30*100}%"></i></td><td class="mono">${pct?(r[0]*100).toFixed(1)+'%':f1(r[0])}</td><td>${rkb(r[1])}</td><td>${rkb(r[2])}</td><td>${rkb(r[3])}</td></tr>`}).join('')}</tbody></table>
    <p class="note">Rank 30 = gives up the most to ${PGN[pos]} (best for ${esc(p.n.split(' ').slice(-1)[0])}), 1 = gives up the least. Turnovers: 30 = forces the fewest. ${NBM.season-1}-${String(NBM.season).slice(2)} regular season through ${new Date(NBM.through+'T12:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}.</p></section>`}
  /* 2. zones: one court, toggled between his scoring and the opponent's zone defense */
  const Z=M.pz[p.id],T=M.tz[o],zv=T?NMX.zv:'me',ln=esc(p.n.split(' ').slice(-1)[0]);
  if(Z){const fga=M.zones.reduce((a,[k])=>a+(Z[k]?Z[k][0]:0),0),pts=M.zones.reduce((a,[k])=>a+(Z[k]?Z[k][2]:0),0)+(Z.FT?Z.FT[2]:0);
    const sh=k=>Z[k]&&fga?Z[k][0]/fga:0,ps=k=>Z[k]&&pts?Z[k][2]/pts:0,fg=k=>Z[k]&&Z[k][0]?Z[k][1]/Z[k][0]:null;
    const mx=Math.max(...M.zones.map(([k])=>sh(k)),.01),C={};
    const lg=k=>{let a=0,m=0;for(const t in M.tz){const r=M.tz[t][k];if(r&&r[1]!=null){a+=r[2];m+=r[2]*r[1]}}return a?m/a:null};
    const zc=k=>{const v=ps(k);return v>=.25?'color-mix(in srgb,var(--grn) 38%,var(--bg))':v>=.10?'color-mix(in srgb,#e3a008 34%,var(--bg))':'color-mix(in srgb,var(--red) 32%,var(--bg))'};
    if(zv==='me')M.zones.forEach(([k])=>{C[k]={f:zc(k),t:pc(ps(k)),b:Z[k]?`${Z[k][2]} pts · ${Z[k][1]}/${Z[k][0]}`:'0 pts'}});
    else M.zones.forEach(([k])=>{const r=T[k];C[k]={f:r?(r[3]>=21?'color-mix(in srgb,var(--grn) 38%,var(--bg))':r[3]>=11?'color-mix(in srgb,#e3a008 34%,var(--bg))':'color-mix(in srgb,var(--red) 32%,var(--bg))'):'var(--pan2)',t:r?'#'+r[3]:'–',b:r?`${f1(r[0])}/g · ${r[1]==null?'–':pc(r[1])}`:''}});
    h+=`<section class="mxc"><h4>Scoring zones</h4>
    ${T?`<div class="mxtab">${[['me',ln+'’s scoring'],['def',esc(nbt(o).short)+' defense']].map(([k,l])=>`<button data-mzv="${k}" aria-pressed="${zv===k}">${l}</button>`).join('')}</div>`:''}
    ${nbcourt(C,zv==='me'?'His shots by zone':'Opponent zone defense')}
    ${zv==='me'?`<div class="mxleg"><span><i class="rw"></i>25%+ of his points</span><span><i class="rm"></i>10–25%</span><span><i class="re"></i>under 10%</span></div><p class="note">Big number: share of his points that come from that zone (free throws count toward the total). Small: points scored there · makes/attempts. Green = where he does most of his scoring. ${fga} shots in ${Z.g} games this season${Z.FT?`, plus ${Z.FT[1]}/${Z.FT[0]} free throws (${pc(ps('FT'))} of his points)`:''}.</p>`
     :`<div class="mxleg"><span><i class="rw"></i>#21–30 weak</span><span><i class="rm"></i>#11–20 mid</span><span><i class="re"></i>#1–10 stingy</span></div><p class="note">${esc(o)}’s rank in each zone by points allowed per game (all opponents; #30 = allows the most). Small: points allowed per game · FG% allowed there.</p>`}
    ${T?`<table class="mxt mxz"><thead><tr><th>Zone</th><th>His pts</th><th>His FG%</th><th>${esc(o)} allows</th><th>Def</th></tr></thead><tbody>
      ${M.zones.slice().sort((a,b)=>ps(b[0])-ps(a[0])).map(([k,l])=>{const r=T[k];return`<tr><td>${l}<i class="mxb ${r?rkc(r[3]):''}" style="width:${ps(k)*100}%"></i></td><td class="mono">${pc(ps(k))}</td><td class="mono">${fg(k)==null?'–':pc(fg(k))}</td><td class="mono">${r?f1(r[0])+'/g':'–'}</td><td>${rkb(r&&r[3])}</td></tr>`}).join('')}
      ${Z.FT?`<tr><td>Free throws<i class="mxb" style="width:${ps('FT')*100}%"></i></td><td class="mono">${pc(ps('FT'))}</td><td class="mono">${Z.FT[0]?pc(Z.FT[1]/Z.FT[0]):'–'}</td><td class="mono">–</td><td>${rkb(null)}</td></tr>`:''}</tbody></table>`:''}</section>`}
  else h+=`<section class="mxc"><h4>Scoring zones</h4><p class="empty">No shots logged for him this season yet.</p></section>`;
  /* 4. similar players vs this team */
  const K=M.simk,mi=K.indexOf(mk==='dd'?'pts':mk),A=M.avg,me=A[p.id],myv=me?me[5+mi]:null,rows=(M.og[o]||[]).filter(r=>r[0]!==p.id&&A[r[0]]&&A[r[0]][1]===pos&&r[3]>=10);
  const sim=NMX.sim==='sim'&&myv!=null?rows.filter(r=>{const a=A[r[0]][5+mi];return Math.abs(a-myv)<=Math.max(2,myv*.3)&&A[r[0]][4]>=Math.max(12,(me[4]||0)-10)}):rows;

   <div class="mxtab">${[['sim','Similar'],['pos','All '+PGN[pos]]].map(([k,l])=>`<button data-msim="${k}" aria-pressed="${NMX.sim===k}">${l}</button>`).join('')}<span class="mxmk">${MKN[mk==='dd'?'pts':mk]}</span></div>
   ${n?`<p class="mxsum">vs line <b class="${ad>0?'w':'l'}">${ad>0?'+':''}${f1(ad)}</b> per game · over in <b>${ov}/${n}</b> (${pc(ov/n)})</p>`:''}
   <div class="mxl">${n?L.map(x=>{const q=A[x.r[0]],pp={id:x.r[0],n:q[0],t:x.r[2]};return`<div class="mxr">${face(pp)}<div class="mxn"><b>${esc(q[0])}</b><small>${x.r[2]} · ${x.r[1].replace('-','/')} · ${x.r[3]} min</small></div>
     <div class="mxv"><b>${x.v}</b><i><span style="width:${x.v/mxv*100}%"></span><em style="left:${(x.ln!=null?x.ln:x.av)/mxv*100}%"></em></i><small>${x.ln!=null?'Line '+x.ln:'avg '+f1(x.av)}</small></div>
     <span class="mxd ${x.d>0?'o':x.d<0?'u':''}">${x.d>0?'↑ +':x.d<0?'↓ ':''}${f1(x.d)}</span></div>`}).join(''):`<p class="empty">No ${NMX.sim==='sim'?'similar ':''}${PGN[pos]} have played ${esc(o)} this season yet.</p>`}</div>
   <p class="note">${NMX.sim==='sim'?`${PGN[pos][0].toUpperCase()+PGN[pos].slice(1)} whose season average in this stat is within 30% of his (${myv==null?'–':f1(myv)}), 10+ minutes that night.`:`Every ${PGN[pos].slice(0,-1)} with 10+ minutes against ${esc(o)}.`} Compared with DraftKings’ main line for that game when there was one, otherwise his season average (“avg”). This season only, newest first.</p></section>`;
  return h+'</div>'}
function nbmxwire(p,G){const b=$('#nbmx');if(!b||!NBM)return;
  b.querySelectorAll('[data-mper]').forEach(x=>x.onclick=()=>{NMX.per=x.dataset.mper;b.innerHTML=nbmx(p,G);nbmxwire(p,G)});

/* ---------- NBA previous weeks: finished games by week (Mon-Sun), by day, with post-game reviews and a search ---------- */
let NBW=null,NBWP=null;const NW={wk:null,q:''};
function nbaweeks(wk){const box=$('#v-nba-weeks');if(!box.dataset.ready){box.dataset.ready=1;box.innerHTML='<p class="note">Loading the season…</p>'}
  NBWP=NBWP||fetch('nbw.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
  Promise.all([NBWP,nbload()]).then(([j])=>{NBW=j;const last=Math.max(...j.games.map(g=>g.wk));NW.wk=wk&&wk<=last?wk:(NW.wk||last);nbwdraw()}).catch(e=>{box.innerHTML=`<p class="empty">Past games did not load (${esc(e.message)}).</p>`})}
function nbwdraw(){const box=$('#v-nba-weeks'),A=NBW.games,weeks=[...new Set(A.map(g=>g.wk))].sort((a,b)=>a-b),d0=new Date(NBW.start+'T12:00:00'),day=s=>new Date(s+'T12:00:00');
  const wlab=w=>{const a=new Date(d0);a.setDate(a.getDate()+7*(w-1));return a.toLocaleDateString('en-US',{month:'short',day:'numeric'})},tn=t=>(NB.teams[t]||{}).short||t,full=t=>((NB.teams[t]||{}).name||t).toLowerCase();
